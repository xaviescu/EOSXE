<style>
  /* =========================================================
     Design tokens — cámbialos aquí y afectan a toda la app.
     ========================================================= */
  :root{
    /* Marca / superficies */
    --brand: #5e6ad2;
    --brand-soft: rgba(94,106,210,0.10);
    --brand-ring: rgba(94,106,210,0.25);
    --bg: #f5f6fa;
    --surface: #ffffff;
    --surface-alt: #edeff4;
    --sidebar-bg: #0f172a;
    --sidebar-fg: rgba(255,255,255,0.70);
    --sidebar-fg-muted: rgba(255,255,255,0.45);
    --sidebar-border: rgba(255,255,255,0.08);

    /* Texto */
    --text: #1a1a2e;
    --text-2: #4b5563;
    --muted: #6b7280;
    --muted-soft: #9ca3af;

    /* Bordes */
    --border: #eef0f4;
    --border-strong: #e0e4ea;

    /* Estados (paleta moderna) */
    --ok-bg: #ecfdf5;   --ok-fg: #065f46;   --ok-line: #10b981;
    --warn-bg: #fffbeb; --warn-fg: #78350f; --warn-line: #f59e0b;
    --err-bg: #fef2f2;  --err-fg: #7f1d1d;  --err-line: #ef4444;
    --info-bg: #f0f9ff; --info-fg: #0c4a6e; --info-line: #0ea5e9;

    /* Radios */
    --r-xs: 4px;
    --r-sm: 6px;
    --r-md: 10px;
    --r-lg: 16px;

    /* Spacing (escala 4-base) */
    --s-1: 4px;  --s-2: 8px;  --s-3: 12px;
    --s-4: 16px; --s-5: 24px; --s-6: 32px;

    /* Typography */
    --f-mini: 10px; --f-xs: 11px; --f-sm: 13px; --f-md: 13px;
    --f-lg: 13px; --f-xl: 20px; --f-2xl: 32px;

    /* Elevation */
    --elev-1: 0 1px 2px rgba(15,23,42,.06), 0 1px 1px rgba(15,23,42,.04);
    --elev-2: 0 4px 12px rgba(15,23,42,.08), 0 2px 4px rgba(15,23,42,.04);
    --elev-3: 0 20px 40px rgba(15,23,42,.15), 0 8px 16px rgba(15,23,42,.08);
  }

  /* Dark mode tokens — reutilizados por 2 selectores:
     (1) Auto: @media prefers-color-scheme:dark cuando el usuario NO ha forzado tema.
     (2) Manual: :root[data-theme="dark"] gana siempre.
     Regla espejo: :root[data-theme="light"] fuerza light aunque el sistema esté oscuro. */
  :root[data-theme="dark"]{
    --bg: #0b1220;
    --surface: #131b2c;
    --surface-alt: #1a2338;
    --sidebar-bg: #060a15;
    --text: #e6ecf5;
    --text-2: #c1cbdb;
    --muted: #8a97ad;
    --muted-soft: #5f6b83;
    --border: #253048;
    --border-strong: #33405c;
    --ok-bg: rgba(16,185,129,0.15);   --ok-fg: #6ee7b7;
    --warn-bg: rgba(245,158,11,0.15); --warn-fg: #fcd34d;
    --err-bg: rgba(239,68,68,0.15);   --err-fg: #fca5a5;
    --info-bg: rgba(14,165,233,0.15); --info-fg: #7dd3fc;
    --elev-1: 0 1px 2px rgba(0,0,0,.5), 0 1px 1px rgba(0,0,0,.35);
    --elev-2: 0 4px 12px rgba(0,0,0,.55), 0 2px 4px rgba(0,0,0,.35);
    --elev-3: 0 20px 40px rgba(0,0,0,.65), 0 8px 16px rgba(0,0,0,.45);
  }
  html,body,#root{margin:0;padding:0;height:100%;width:100%;max-width:100vw;background:var(--bg);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    font-feature-settings:'cv02','cv11','ss01';
    overflow-x:hidden;-webkit-text-size-adjust:100%;}
  /* Tabular numbers in tables — all figures align in columns. */
  table, .num{font-variant-numeric:tabular-nums;}
  /* iOS Safari zoom fix — inputs at 16px ONLY on mobile to avoid autozoom. */
  @media (max-width: 768px){
    input:not([type="checkbox"]):not([type="radio"]), textarea, select{font-size:16px !important;}
  }
  /* iOS PWA fix — use full physical screen (100lvh = large viewport, includes home
     indicator zone) instead of 100dvh which falls short and leaves a gray strip.
     Also prevents elastic bounce. Safari browser intact. */
  @media (display-mode: standalone){
    html, body{overscroll-behavior:none; height:100lvh;}
    .app-shell{min-height:100lvh !important;}
    main.main-content{max-height:100lvh !important; min-height:100lvh !important;}
    nav.sidebar{height:100lvh !important;}
  }
  /* Zebra striping — filas pares con fondo sutil. Se activa con class="zebra". */
  table.zebra tbody tr:nth-child(even) > td{background:var(--surface-alt);}
  /* Table header brand — cabeceras de tabla con marca indigo. */
  tr.th-brand th{
    color:var(--brand) !important;
    text-transform:uppercase !important; letter-spacing:0.6px !important;
    font-size:11px !important; font-weight:700 !important;
  }
  tr.th-brand th > div{color:var(--brand) !important;}

  /* Prevent iOS Safari from auto-zooming on input focus (happens when
     input font-size < 16px). Applies on touch devices only, so desktop
     keeps its compact input font-size. */
  @media (pointer: coarse){
    input,textarea,select{font-size:16px !important;}
  }
  /* Reserve scrollbar space so layout doesn't jump when content grows/shrinks
     - Only on devices with a fine pointer (desktop) where scrollbars take
       up layout width. On touch devices (mobile/tablet) scrollbars overlay
       and this rule would force unwanted layout width shifts. */
  @media (pointer: fine){
    main.main-content{scrollbar-gutter:stable;overflow-y:scroll;}
  }
  *{box-sizing:border-box;}
  input,textarea,select,button{font-family:inherit;}

  /* =========================================================
     Estados interactivos — hover, focus, active
     ========================================================= */
  /* Botones (consumido por el componente Btn y por botones ad-hoc con class="btn") */
  .btn{transition:background .15s ease, color .15s ease, transform .05s ease, box-shadow .15s ease; user-select:none;}
  .btn:hover{filter:brightness(1.05);}
  .btn:active{transform:translateY(1px);}
  .btn:focus-visible{outline:none; box-shadow:0 0 0 3px var(--brand-ring);}
  .btn-sec:hover{background:var(--brand-soft) !important;}

  /* Nav item de la sidebar */
  .nb-item{transition:background .12s ease, color .12s ease;}
  .nb-item:hover{background:rgba(255,255,255,0.06) !important; color:rgba(255,255,255,0.95);}
  .nb-item:focus-visible{outline:none; background:rgba(255,255,255,0.09) !important; color:rgba(255,255,255,0.95);}
  .nb-item.active,
  .nb-item.active:hover{background:var(--brand-soft) !important; color:var(--brand);}

  /* Botones del footer de la sidebar (Export / Import / Imprimir / Bloquear) */
  .side-btn{
    padding:6px 0; border-radius:var(--r-sm);
    border:1px solid rgba(255,255,255,0.10);
    background:rgba(255,255,255,0.04);
    color:rgba(255,255,255,0.65);
    cursor:pointer; font-size:11px; font-family:inherit;
    transition:background .12s ease, color .12s ease, border-color .12s ease;
  }
  .side-btn:hover{background:rgba(255,255,255,0.10); color:#fff; border-color:rgba(255,255,255,0.20);}
  .side-btn:focus-visible{outline:none; box-shadow:0 0 0 2px var(--brand-ring);}
  .side-btn:active{transform:translateY(1px);}

  /* Inputs, textareas, selects — focus ring naranja global.
     Se aplica a todos los form fields de la app (excepto los de la sidebar,
     que no tiene ninguno). Usa :focus (no :focus-visible) para que también
     funcione al hacer click con ratón, no solo con Tab. */
  main.main-content input:focus,
  main.main-content textarea:focus,
  main.main-content select:focus{
    border-color:var(--brand) !important;
    box-shadow:0 0 0 3px var(--brand-ring);
    transition:border-color .12s ease, box-shadow .12s ease;
  }

  /* Cards with optional hover (elevation on pointer) */
  .card-hover{transition:box-shadow .15s ease;}
  .card-hover:hover{box-shadow:var(--elev-2);}

  /* DatePicker */
  .dp-nav{transition:background .12s, border-color .12s, color .12s;}
  .dp-nav:hover{background:var(--surface-alt); border-color:var(--border-strong); color:var(--text);}
  .dp-nav:focus-visible{outline:none; box-shadow:0 0 0 2px var(--brand-ring);}
  .dp-day{transition:background .1s;}
  .dp-day:hover{background:var(--brand-soft);}
  .dp-day:focus-visible{outline:none; box-shadow:inset 0 0 0 2px var(--brand-ring);}
  .dp-action{transition:background .12s, color .12s;}
  .dp-action:hover{background:var(--border-strong); color:var(--text);}

  /* Underline tabs — reemplaza los tabs "big pill" por una fila con
     línea de 2px bajo el activo. Uso:
       <div class="tabbar"><button class="tab-underline">A</button>
                           <button class="tab-underline active">B</button></div>
  */
  .tabbar{
    display:flex; gap:var(--s-1); align-items:stretch;
    border-bottom:1px solid var(--border);
    margin-bottom:var(--s-4); flex-wrap:wrap;
  }
  .tab-underline{
    padding:10px 14px; border:none; background:transparent; cursor:pointer;
    font-size:var(--f-sm); font-weight:600; color:var(--muted);
    position:relative; margin-bottom:-1px;
    border-bottom:2px solid transparent;
    transition:color .12s ease, border-color .12s ease, background .12s ease;
    white-space:nowrap;
  }
  @media (max-width: 768px){
    .tab-underline{padding:10px 10px;}
  }
  .tab-underline:hover{color:var(--text); background:var(--brand-soft);}
  .tab-underline:focus-visible{outline:none; box-shadow:0 0 0 3px var(--brand-ring); border-radius:6px 6px 0 0;}
  .tab-underline.active{color:var(--brand); border-bottom-color:var(--brand); font-weight:700;}
  /* Hide number input spinner buttons (score metrics use bare numeric cells) */
  input.score-cell::-webkit-outer-spin-button,
  input.score-cell::-webkit-inner-spin-button {-webkit-appearance:none; margin:0;}
  input.score-cell {-moz-appearance:textfield;}
  /* iOS safe areas */
  body{padding:0;}

  /* Print styles */
  @media print {
    body{padding:0;background:white;}
    .no-print{display:none !important;}
    .print-page-break{page-break-before:always;}
    .print-section{page-break-inside:avoid;}
    .print-area{padding:0 !important;max-height:none !important;overflow:visible !important;}
    nav.sidebar{display:none !important;}
    main.main-content{padding:0 !important;max-height:none !important;
      overflow:visible !important;overflow-x:visible !important;overflow-y:visible !important;
      scrollbar-gutter:auto !important;height:auto !important;}
    /* Hide any scrollbar in print mode */
    html,body{overflow:visible !important;overflow-y:visible !important;
      scrollbar-gutter:auto !important;height:auto !important;}
    html::-webkit-scrollbar,body::-webkit-scrollbar,main::-webkit-scrollbar{display:none !important;width:0 !important;}
    .print-view{padding:0 !important;}
    .print-view h1{font-size:22pt;}
    .print-view h2{font-size:16pt;page-break-after:avoid;}
    .print-view h3{font-size:13pt;page-break-after:avoid;}
    .print-view table{page-break-inside:auto;}
    .print-view tr{page-break-inside:avoid;page-break-after:auto;}
    a{color:black !important;text-decoration:none !important;}
    @page{
      margin:16mm 12mm 14mm;
      size:A4;
      @top-right{content:"EOS XE — página " counter(page); font-size:9pt; color:#888;}
      @bottom-center{content:counter(page); font-size:9pt; color:#888;}
    }
    .print-view{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
  }

  /* Slide-in animation for InlineForm */
  @keyframes slideIn{
    from{opacity:0; transform:translateY(-4px);}
    to{opacity:1; transform:translateY(0);}
  }
  .inline-form-anim{animation: slideIn .18s ease-out;}
</style>

<script>
  // PWA service worker registration + auto-reload on update
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      // updateViaCache:'none' forces Chrome to always fetch sw.js from
      // the network (bypasses HTTP cache) so new SW versions are detected
      // immediately after each deploy.
      navigator.serviceWorker.register('./sw.js', {updateViaCache: 'none'}).then(reg => {
        // Force an update check right after registering (in case a new SW is on the server)
        reg.update();
        // And again every time the tab regains focus
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') reg.update();
        });
        // And every 60s while the tab is open
        setInterval(() => reg.update(), 60000);
      }).catch(err => console.warn('SW failed', err));

      // When a new SW takes control (after skipWaiting + claim), reload the page
      let reloading = false;
      navigator.serviceWorker.addEventListener('message', e => {
        if (e.data && e.data.type === 'SW_UPDATED' && !reloading) {
          reloading = true;
          window.location.reload();
        }
      });
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloading) return;
        reloading = true;
        window.location.reload();
      });
    });
  }
</script>

<script type="text/babel" data-presets="react">
const {useState, useEffect, useRef, useCallback} = React;

// Reactive isMobile hook — uses matchMedia (respects CSS media queries and
// updates on resize/orientation change). More reliable than window.innerWidth
// which can return the wrong value on iOS standalone PWA before the viewport
// meta is parsed.
function useIsMobile() {
  const mq = () => window.matchMedia('(max-width: 700px)');
  const [isMobile, setIsMobile] = useState(() => {
    try { return mq().matches; } catch (e) { return false; }
  });
  useEffect(() => {
    const m = mq();
    const on = e => setIsMobile(e.matches);
    if (m.addEventListener) m.addEventListener('change', on);
    else m.addListener(on);
    // Force one recheck after layout settles (iOS PWA quirk)
    const t = setTimeout(() => setIsMobile(m.matches), 100);
    return () => {
      if (m.removeEventListener) m.removeEventListener('change', on);
      else m.removeListener(on);
      clearTimeout(t);
    };
  }, []);
  return isMobile;
}

// =====================================================================
// Constants & helpers
// =====================================================================
const STORE_KEY = "eos-xe-cfg-v1";   // stores supabase URL + anon key + PIN
const ROW_ID = "main";
const uid = () => Math.random().toString(36).slice(2, 8);
const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const SLOTS = Array.from({length:34}, (_,i) => ({
  h: Math.floor(i/2)+6,
  m: i%2===0 ? 0 : 30,
  lbl: `${Math.floor(i/2)+6}:${i%2===0 ? '00' : '30'}`
}));
const MONTHS_F = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const SI = {
  'on-track': ['var(--ok-bg)',   'var(--ok-fg)',   'On Track'],
  'at-risk':  ['var(--warn-bg)', 'var(--warn-fg)', 'At Risk'],
  'not-done': ['var(--err-bg)',  'var(--err-fg)',  'Not Done'],
  'done':     ['var(--info-bg)', 'var(--info-fg)', 'Done']
};

// Day status: usado por Scorecard (main), Scorecard summary y L10Scorecard.
// Tuple [bg, fg, label]. Fallback for unknown status.
const DAY_STATUS = {
  ok:  ['transparent', 'var(--text-2)',    '✓'],
  nok: ['transparent', 'var(--muted-soft)', '×']
};
const getDayStatus = st => DAY_STATUS[st] || ['transparent', 'var(--muted-soft)', '·'];
// Minimalist SVG rendering of scorecard tick.
// ok with more weight (text-2) to highlight completions, nok and empty light (muted-soft).
function DayTick({st, size}) {
  const sz = size || 15;
  const col = st === 'ok' ? 'var(--text-2)' : 'var(--muted-soft)';
  const sw = st === 'ok' ? 2 : 1.75;
  const props = {width:sz, height:sz, viewBox:'0 0 24 24', fill:'none',
                 stroke:col, strokeWidth:sw, strokeLinecap:'round', strokeLinejoin:'round',
                 style:{display:'inline-block', verticalAlign:'middle'}};
  if (st === 'ok')  return <svg {...props}><polyline points="20 6 9 17 4 12"/></svg>;
  if (st === 'nok') return <svg {...props}><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>;
  return <span style={{color:'var(--muted-soft)', fontSize:13, fontWeight:500}}>·</span>;
}
const YEAR = 2026;
const QS = ['Q1','Q2','Q3','Q4'];
const qWeeks = q => Array.from({length:13}, (_,i) => (q-1)*13 + 1 + i);
const FIRST_MON = new Date(Date.UTC(2025, 11, 29));

const dayDate = (wn, di) => new Date(FIRST_MON.getTime() + ((wn-1)*7 + di) * 864e5);
const dayStr = (wn, di) => {
  const d = dayDate(wn, di);
  return [d.getUTCFullYear(),
          String(d.getUTCMonth()+1).padStart(2,'0'),
          String(d.getUTCDate()).padStart(2,'0')].join('-');
};
const dayShort = (wn, di) =>
  dayDate(wn, di).toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'UTC'});
const wDates = wn => dayShort(wn,0) + ' - ' + dayShort(wn,6);
// Next Monday (YYYY-MM-DD) after the reference week's Sunday. If no wn given,
// uses current calendar week. Used for todos generated in L10/QReview.
const nextMondayStr = wn => {
  const ref = wn != null ? wn : getCurWn();
  return dayStr(ref + 1, 0);
};
const getCurQ = () => {
  const n = new Date();
  return n.getFullYear() + '-Q' + Math.floor(n.getMonth()/3 + 1);
};
const getCurWn = () =>
  Math.max(1, Math.floor((Date.now() - FIRST_MON.getTime()) / 864e5 / 7) + 1);
const wKey = wn => YEAR + '-' + wn;
const todayStr = () => new Date().toISOString().slice(0, 10);
const dateToWn = ds =>
  Math.max(1, Math.floor((new Date(ds + 'T00:00:00Z').getTime() - FIRST_MON.getTime()) / 864e5 / 7) + 1);
const sWks = s => {
  const a = s.startWeek || s.weekNum || 1;
  const b = s.endWeek || s.weekNum || a;
  return Array.from({length: b-a+1}, (_,i) => a+i);
};
const QS_ORDER = ['Q1','Q2','Q3','Q4'];
// Flat list of yearRocks in area+position order, each tagged with num (R1, R2...).
// Dedupes area buckets by NORMALIZED label so duplicate/legacy keys collapse
// into a single visual group (case + numeric-prefix insensitive).
const getYearRocksFlat = (data) => {
  const yr = (data.yearRocks && data.yearRocks[String(YEAR)]) || {};
  const areasList = (data.vision && data.vision.areasList) || [];
  const nk = s => (s || '').toString().trim().toLowerCase().replace(/^\d+\.\s*/, '');
  const flat = [];
  const seen = {}; // normalized label -> canonical {k, label}
  areasList.forEach(la => {
    const key = nk(la.label);
    const canonical = seen[key] || la;
    if (!seen[key]) seen[key] = la;
    (yr[la.k] || []).forEach(rock => flat.push({areaKey: canonical.k, areaLabel: canonical.label, rock}));
  });
  Object.keys(yr).forEach(ak => {
    if (areasList.some(la => la.k === ak)) return;
    const key = nk(ak);
    const canonical = seen[key] || {k: ak, label: ak};
    if (!seen[key]) seen[key] = canonical;
    (yr[ak] || []).forEach(rock => flat.push({areaKey: canonical.k, areaLabel: canonical.label, rock}));

  return flat.map((r, i) => ({...r, num: i + 1}));
};
const getRockNumById = (data, rockId) => {
  const flat = getYearRocksFlat(data);
  const found = flat.find(x => x.rock.id === rockId);
  return found ? found.num : null;
};
// Rocks active in a given quarter, expanded to legacy shape used by GanttChart/Rocks:
// {id, title, status, num, explanation, area}.
const getQuarterRocks = (data, qKey) => {
  const qN = qKey.split('-')[1];
  const qData = (data.quarters && data.quarters[qKey]) || {};
  const rs = qData.rockStatus || {};
  return getYearRocksFlat(data)
    .filter(x => x.rock.quarters && x.rock.quarters[qN])

      id: x.rock.id,

      num: x.num,
      area: x.areaLabel,
      areaKey: x.areaKey,
      completed: !!x.rock.completed,
      status: rs[x.rock.id] || 'on-track'
    }));
};
const isWkDone = (s, wn) => !!(s.weeklyDone && s.weeklyDone[wn]);
// Metric types: 'tick' (ok/nok/null per day) or 'score' (0-100 per day).
const metricIsScore = m => m && m.type === 'score';
// Weekly count of 'ok' ticks for tick metrics.
const weekTickCnt = (m, wn) => DAYS.reduce((acc, _, di) =>
  (m.dayData && m.dayData[dayStr(wn, di)] === 'ok' ? acc + 1 : acc), 0);
// True if the week has any 'nok' (X) mark and zero 'ok' marks — i.e. the user
// explicitly recorded misses. Used to distinguish "no data" (·) from "recorded zero".
const weekAllX = (m, wn) => {
  let hasNok = false;
  for (let di = 0; di < DAYS.length; di++) {
    const st = m.dayData && m.dayData[dayStr(wn, di)];
    if (st === 'ok') return false;
    if (st === 'nok') hasNok = true;
  }
  return hasNok;
};
// Weekly average of numeric scores. Returns null if no entries.
const weekScoreAvg = (m, wn) => {
  const vals = DAYS.map((_, di) => m.dayData && m.dayData[dayStr(wn, di)])
    .filter(v => typeof v === 'number' && !isNaN(v));
  if (!vals.length) return null;
  return vals.reduce((a, b) => a + b, 0) / vals.length;
};
// Format a score / average with the metric's configured decimals (default 0).
const fmtScore = (v, m) => {
  if (v == null || isNaN(v)) return '—';
  const d = m && typeof m.decimals === 'number' ? m.decimals : 0;
  return Number(v).toFixed(d);
};
const stepEndWk = s => s.endWeek || s.weekNum || s.startWeek || 1;
// A step is DONE if its end-week cell is marked OR any week AFTER end-week is
// marked (that's the "late marker" click), or the legacy step.done flag is set.
const stepDone = s => {
  if (s.done) return true;
  const ew = stepEndWk(s);
  if (isWkDone(s, ew)) return true;
  if (s.weeklyDone) {
    return Object.keys(s.weeklyDone).some(w => parseInt(w) > ew && s.weeklyDone[w]);
  }
  return false;
};
// A step is OVERDUE when we've passed its end-week (in the same quarter) and
// it hasn't been closed yet (no end-week nor later cell marked).
const isStepOverdue = (s, curWn) => curWn > stepEndWk(s) && !stepDone(s);
const getDayOfWeek = ds => {
  const d = new Date(ds + 'T12:00:00Z');
  return ['S','M','T','W','T','F','S'][d.getUTCDay()];
};

// Event colors (cycled by clicking on an event in Calendar or Daily Summary)
// 4-state cycle: gray -> blue -> green -> orange -> gray ...
// Std Week event with no color set displays as gray (next click -> blue)
// New regular event with no color set displays as blue (next click -> green)
const EVENT_COLOR_CYCLE = ['gray', 'blue', 'green', 'orange'];
const EVENT_COLOR_STYLES = {
  gray:   {bg:'var(--surface-alt)', text:'var(--text)',    border:'var(--muted-soft)'},
  blue:   {bg:'var(--info-bg)',     text:'var(--info-fg)', border:'var(--info-line)'},
  green:  {bg:'var(--ok-bg)',       text:'var(--ok-fg)',   border:'var(--ok-line)'},
  orange: {bg:'var(--warn-bg)',     text:'var(--warn-fg)', border:'var(--warn-line)'}
};
const effectiveEventColor = (ev) => {
  if (ev.color && EVENT_COLOR_STYLES[ev.color]) return ev.color;
  return ev.isStdWeek ? 'gray' : 'blue';
};
const cycleEventColor = (ev) => {
  const cur = effectiveEventColor(ev);
  const idx = EVENT_COLOR_CYCLE.indexOf(cur);
  return EVENT_COLOR_CYCLE[(idx + 1) % EVENT_COLOR_CYCLE.length];
};
const eventStyle = (ev) => EVENT_COLOR_STYLES[effectiveEventColor(ev)];
const eventEndTime = (ev) => {
  const totalMin = ev.h * 60 + (ev.m || 0) + Math.round((ev.duration || 1) * 60);
  const eh = Math.floor(totalMin / 60);
  const em = totalMin % 60;
  return {h: eh, m: em};
};
const fmtTime = (h, m) => h + ':' + String(m || 0).padStart(2, '0');

const normalizeData = p => {
  const base = {
    ...INIT, ...p,
    monthNotes: p.monthNotes || {},
    stdWeeklyEvents: p.stdWeeklyEvents || [],
    weeklyProjects: p.weeklyProjects || {},
    yearRocks: p.yearRocks || {}
  };
  // Vision.areasList: user-editable ordered list of life areas. Falls back to
  // built-in LIFE_AREAS on first load. Vision.areas[k] holds per-area content.
  const vSrc = p.vision || {};
  const areasList = (vSrc.areasList && vSrc.areasList.length)
    ? vSrc.areasList.map(a => ({k: a.k, label: a.label}))
    : LIFE_AREAS.map(a => ({k: a.k, label: a.label}));
  const areasSrc = vSrc.areas || {};
  const areas = {};
  areasList.forEach(a => {
    const cur = areasSrc[a.k] || {};
    areas[a.k] = {
      phrase: cur.phrase || '',
      roles: cur.roles || [],
      values: cur.values || [],
      vision: cur.vision || [],
      ltView: cur.ltView || '',
      threeYearView: cur.threeYearView || '',
      oneYearView: cur.oneYearView || '',
      ltGoals: cur.ltGoals || [],
      threeYearGoals: cur.threeYearGoals || [],
      oneYearGoals: cur.oneYearGoals || []
    };
  });
  base.vision = {...INIT_V, ...vSrc, areas, areasList};

  // -----------------------------------------------------------------
  // ROCKS v2 migration:
  //   Old model: rocks defined per quarter (data.quarters[qKey].rocks).
  //   New model: rocks defined once in yearRocks with a `quarters` map;
  //   status is stored per-quarter in data.quarters[qKey].rockStatus.
  // -----------------------------------------------------------------
  if (!base._rocksV2) {
    if (!base.yearRocks) base.yearRocks = {};
    const yKey = String(YEAR);
    if (!base.yearRocks[yKey]) base.yearRocks[yKey] = {};
    const yr = base.yearRocks[yKey];
    const firstArea = (areasList[0] && areasList[0].k) || 'selfm';
    // Index existing yearRocks by id
    const yrById = {};
    Object.keys(yr).forEach(ak => {
      (yr[ak] || []).forEach(r => { yrById[r.id] = {area: ak, rock: r}; });
    });
    Object.keys(base.quarters || {}).forEach(qk => {
      const q = base.quarters[qk];
      const qN = qk.split('-')[1];
      if (!QS_ORDER.includes(qN)) return;
      if (!q.rockStatus) q.rockStatus = {};
      (q.rocks || []).forEach(r => {
        if (!r || !r.id) return;
        q.rockStatus[r.id] = r.status || 'on-track';
        if (yrById[r.id]) {
          const yrRock = yrById[r.id].rock;
          if (!yrRock.quarters) yrRock.quarters = {};
          yrRock.quarters[qN] = true;
        } else {
          if (!yr[firstArea]) yr[firstArea] = [];
          const newRock = {
            id: r.id,
            title: r.title || '',
            explanation: r.explanation || '',
            quarters: {[qN]: true}
          };
          yr[firstArea].push(newRock);
          yrById[r.id] = {area: firstArea, rock: newRock};
        }
      });
    });
    base._rocksV2 = true;
  }
  // Ensure every yearRock has a `quarters` map (never undefined)
  Object.keys(base.yearRocks || {}).forEach(y => {
    Object.keys(base.yearRocks[y] || {}).forEach(ak => {
      (base.yearRocks[y][ak] || []).forEach(r => { if (!r.quarters) r.quarters = {}; });
    });
  });
  // Ensure each quarter has rockStatus map
  Object.keys(base.quarters || {}).forEach(qk => {
    if (!base.quarters[qk].rockStatus) base.quarters[qk].rockStatus = {};
  });

  // Area de-duplication migration (one-shot). Fixes cases where yearRocks are
  // stored under two different areaKeys that share the same visible label
  // (e.g. legacy `SelfM` vs. current `selfm`, or duplicated areasList entries).
  // Strategy:
  //   1. Dedupe vision.areasList by label (case-insensitive), keeping the first.
  //   2. For every areaKey found in yearRocks that isn't in areasList, try to
  //      merge it into the areasList entry with the same normalized label
  //      (label match against the ORPHAN key, or fallback: exact key match
  //      case-insensitive). Move its rocks into the canonical area's bucket.
  const normLbl = s => (s || '').toString().trim().toLowerCase().replace(/^\d+\.\s*/, '');
  if (base.vision && Array.isArray(base.vision.areasList)) {
    const seenLbl = {};
    const rekey = {}; // oldKey -> newKey (for moving yearRocks)
    const dedupedList = [];
    base.vision.areasList.forEach(a => {
      const key = normLbl(a.label);
      if (seenLbl[key]) {
        rekey[a.k] = seenLbl[key];
      } else {
        seenLbl[key] = a.k;
        dedupedList.push(a);
      }
    });
    base.vision.areasList = dedupedList;
    // Move rocks from removed area buckets to their canonical target
    Object.keys(base.yearRocks || {}).forEach(y => {
      const yr = base.yearRocks[y];
      Object.keys(yr).forEach(ak => {
        if (rekey[ak]) {
          const target = rekey[ak];
          if (!yr[target]) yr[target] = [];
          yr[target] = yr[target].concat(yr[ak] || []);
          delete yr[ak];
        }
      });
    });
  }
  // Now handle orphan areaKeys in yearRocks (not in areasList): merge into the
  // areasList entry whose label matches (normalized). If no match, leave as-is.
  if (base.vision && Array.isArray(base.vision.areasList)) {
    const labelToKey = {};
    base.vision.areasList.forEach(a => { labelToKey[normLbl(a.label)] = a.k; });
    // Also index by the key itself (case-insensitive) as a fallback
    const keyLower = {};
    base.vision.areasList.forEach(a => { keyLower[a.k.toLowerCase()] = a.k; });
    Object.keys(base.yearRocks || {}).forEach(y => {
      const yr = base.yearRocks[y];
      Object.keys(yr).forEach(ak => {
        if (base.vision.areasList.some(a => a.k === ak)) return;
        const target = labelToKey[normLbl(ak)] || keyLower[ak.toLowerCase()];
        if (target && target !== ak) {
          if (!yr[target]) yr[target] = [];
          yr[target] = yr[target].concat(yr[ak] || []);
          delete yr[ak];
        }
      });
    });
  }

  // IDS session scoping migration: tag every existing issue with a sessionKey
  // ('w'+weekNum for L10 origin, 'qreview' for Q Review origin). Legacy issues
  // have no sessionKey — infer from weekAdded/weekNum. Since we can't reliably
  // distinguish historical L10 vs QReview issues, default all legacy ones to
  // their week's L10 session.
  Object.keys(base.quarters || {}).forEach(qk => {
    const arr = base.quarters[qk].idsIssues || [];
    arr.forEach(i => {
      if (!i.sessionKey) {
        const wk = i.weekAdded || i.weekNum;
        i.sessionKey = wk ? ('w' + wk) : 'qreview';
      }
    });
  });

  return base;
};

// =====================================================================
// Crypto helpers (PIN -> AES-GCM)
// =====================================================================
const enc = new TextEncoder();
const dec = new TextDecoder();

async function deriveKey(pin) {
  const baseKey = await crypto.subtle.importKey(
    'raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']
  );
  return await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt: enc.encode('eos-xe-static-salt-v1'), iterations: 100000, hash:'SHA-256'},
    baseKey,
    {name:'AES-GCM', length:256},
    false, ['encrypt','decrypt']
  );
}

const buf2b64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const b642buf = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function encryptJSON(obj, key) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(JSON.stringify(obj)));
  return {ciphertext: buf2b64(ct), iv: buf2b64(iv)};
}

async function decryptJSON(ciphertextB64, ivB64, key) {
  const pt = await crypto.subtle.decrypt(
    {name:'AES-GCM', iv: b642buf(ivB64)}, key, b642buf(ciphertextB64)
  );
  return JSON.parse(dec.decode(pt));
}

// Monday-first DatePicker (replaces native <input type="date"> everywhere
// in the app so the calendar dropdown always starts the week on Monday).
function DatePicker({value, onChange, placeholder, style}) {
  const [open, setOpen] = useState(false);
  const [pos, setPos] = useState({top:0, left:0, openUp:false});
  const ref = useRef();
  const popRef = useRef();
  const inputRef = useRef();
  const initial = () => {
    if (value) {
      const parts = value.split('-');
      if (parts.length === 3) return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, 1);
    }
    const n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), 1);
  };
  const [viewMonth, setViewMonth] = useState(initial);

  useEffect(() => {
    const onClick = e => {
      if (ref.current && !ref.current.contains(e.target)
          && !(popRef.current && popRef.current.contains(e.target))) setOpen(false);
    };
    if (open) document.addEventListener('mousedown', onClick);
    return () => document.removeEventListener('mousedown', onClick);
  }, [open]);

  // Position the popup as position:fixed so it escapes overflow:hidden parents.
  useEffect(() => {
    if (!open || !inputRef.current) return;
    const compute = () => {
      const r = inputRef.current.getBoundingClientRect();
      const popH = 300; // approximate max height
      const vpH = window.innerHeight;
      const openUp = (r.bottom + popH + 8 > vpH) && (r.top - popH - 8 > 0);
      const popW = 248;
      let left = r.left;
      if (left + popW + 8 > window.innerWidth) left = Math.max(8, window.innerWidth - popW - 8);
      setPos({
        top: openUp ? (r.top - popH - 4) : (r.bottom + 4),
        left,
        openUp
      });
    };
    compute();
    window.addEventListener('scroll', compute, true);
    window.addEventListener('resize', compute);
    return () => {
      window.removeEventListener('scroll', compute, true);
      window.removeEventListener('resize', compute);
    };
  }, [open]);

  // Keep the visible month synced when the value changes externally
  useEffect(() => {
    if (open && value) {
      const parts = value.split('-');
      if (parts.length === 3) {
        const y = parseInt(parts[0]), m = parseInt(parts[1]) - 1;
        if (y !== viewMonth.getFullYear() || m !== viewMonth.getMonth()) {
          setViewMonth(new Date(y, m, 1));
        }
      }
    }
  }, [open]);

  const fmt = (y, m, d) => y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  const todayDS = (() => { const n = new Date(); return fmt(n.getFullYear(), n.getMonth(), n.getDate()); })();

  const year = viewMonth.getFullYear();
  const month = viewMonth.getMonth();
  const firstDay = new Date(year, month, 1);
  // JS getDay: 0=Sunday..6=Saturday. Convert to Monday-first: 0=Mon..6=Sun
  const startCol = (firstDay.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startCol; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);

  const monthNames = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const dayLabels = ['L','M','X','J','V','S','D'];

  const select = d => { onChange(fmt(year, month, d)); setOpen(false); };
  const prevMonth = e => { e.stopPropagation(); setViewMonth(new Date(year, month - 1, 1)); };
  const nextMonth = e => { e.stopPropagation(); setViewMonth(new Date(year, month + 1, 1)); };

  const navBtn = {width:26, height:26, border:'1px solid var(--border)', background:'var(--surface)',
                  cursor:'pointer', borderRadius:'var(--r-sm)', color:'var(--muted)', lineHeight:1,
                  display:'inline-flex', alignItems:'center', justifyContent:'center'};
  const chev = dir => (
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
      {dir === 'left' ? <polyline points="15 18 9 12 15 6"/> : <polyline points="9 18 15 12 9 6"/>}
    </svg>
  );

  return (
    <div ref={ref} style={{position:'relative', ...(style || {})}}>
      <input ref={inputRef} value={value || ''} readOnly placeholder={placeholder || 'YYYY-MM-DD'}
        onClick={() => setOpen(o => !o)}
        style={{...S.inp, cursor:'pointer', backgroundImage:'none'}}/>
      {open && (
        <div ref={popRef}
          style={{position:'fixed', top:pos.top, left:pos.left, background:'var(--surface)',
                  borderRadius:'var(--r-md)', boxShadow:'var(--elev-3)', padding:10,
                  zIndex:9999, width:248, border:'1px solid var(--border)'}}>
          <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:8}}>
            <button onClick={prevMonth} className="dp-nav" title="Mes anterior" style={navBtn}>{chev('left')}</button>
            <div style={{fontWeight:700, fontSize:13, color:'var(--text)'}}>{monthNames[month]} {year}</div>
            <button onClick={nextMonth} className="dp-nav" title="Mes siguiente" style={navBtn}>{chev('right')}</button>
          </div>
          <div style={{display:'grid', gridTemplateColumns:'repeat(7, 1fr)', gap:2}}>
            {dayLabels.map(d => (
              <div key={d} style={{textAlign:'center', fontSize:10, fontWeight:700, color:'var(--muted)', padding:'3px 0'}}>{d}</div>
            ))}
            {cells.map((d, i) => {
              if (d === null) return <div key={i}/>;
              const ds = fmt(year, month, d);
              const isSel = ds === value;
              const isToday = ds === todayDS;
              return (
                <button key={i} onClick={() => select(d)} className="dp-day"
                  style={{height:30, border:'none', cursor:'pointer', borderRadius:'var(--r-sm)',
                          background: isSel ? 'var(--brand)' : 'transparent',
                          color: isSel ? 'white' : (isToday ? 'var(--brand)' : 'var(--text)'),
                          fontWeight: (isSel || isToday) ? 700 : 400, fontSize:13,
                          boxShadow: (isToday && !isSel) ? 'inset 0 0 0 1.5px var(--brand)' : 'none'}}>{d}</button>
              );
            })}
          </div>
          <div style={{display:'flex', gap:5, marginTop:8, justifyContent:'space-between'}}>
            <button onClick={() => { onChange(todayDS); setOpen(false); }} className="dp-action"

function IssueBtn({idsIssues, sourceId, sourceName, weekNum, upd, qKey, sessionKey}) {
  // Highlight only if there's an issue for this source that is VISIBLE in this
  // session's IDS view. Issues are scoped per-session (L10 week or QReview) via
  // sessionKey — we only match issues tagged with the current sessionKey.
  const active = (idsIssues || []).some(i => {
    if (i.sourceId !== sourceId) return false;
    if (sessionKey && i.sessionKey !== sessionKey) return false;
    if (i.weekAdded > weekNum) return false;
    if (i.weekAdded === weekNum) return true;
    if (!i.solved) return true;
    return (i.solvedWeek || 0) >= weekNum;
  });
  const toggle = () => upd(d => {
    ensureQ(d, qKey);
    const idx = d.quarters[qKey].idsIssues.findIndex(i =>
      i.sourceId === sourceId && !i.solved &&
      (!sessionKey || i.sessionKey === sessionKey));
    if (idx >= 0) {
      d.quarters[qKey].idsIssues[idx].solved = true;
      d.quarters[qKey].idsIssues[idx].solvedWeek = weekNum;
    } else {
      d.quarters[qKey].idsIssues.push({
        id: uid(), sourceId, sourceName,
        action:'', solved:false, solvedWeek:null, weekAdded: weekNum,
        sessionKey: sessionKey || ('w' + weekNum)
      });
    }
  });
  return (
    <button onClick={toggle}
      style={{padding:'2px 8px', borderRadius:'var(--r-md)',
              border:'1px solid ' + (active ? 'var(--err-line)' : 'var(--border-strong)'),
              cursor:'pointer', fontSize:10, fontWeight:700, flexShrink:0,
              background: active ? 'var(--err-bg)' : 'white',
              color: active ? 'var(--err-fg)' : 'var(--muted-soft)', whiteSpace:'nowrap'}}>
      {active ? 'Issue' : '+ Issue'}
    </button>
  );
}

// =====================================================================
// Calendar
// =====================================================================
function CalTable({events, onCellClick, onDelete, onCycleColor, onEdit, dayLabels, compact, calView, focusDay, setFocusDay}) {
  compact = compact || false;
  calView = calView || 'week';
  focusDay = focusDay != null ? focusDay : 0;
  const HOUR_W = compact ? 30 : 44;
  const SLOT_H = compact ? 18 : 22;
  const HEADER_H = compact ? 38 : 50;
  const slotIdx = (h, m) => (h - 6) * 2 + (m >= 30 ? 1 : 0);

  // LIST view — linear list grouped by day. Return early.
  if (calView === 'list') {
    const byDay = DAYS.map((_, di) => events.filter(e => e.day === di).sort((a,b) => (a.h*60+(a.m||0)) - (b.h*60+(b.m||0))));
    return (
      <div style={{background:'var(--surface)', borderRadius:'var(--r-md)', padding:'10px 12px',
                   boxShadow:'0 2px 8px rgba(0,0,0,0.06)'}}>
        {DAYS.map((day, di) => {
          const evts = byDay[di];
          if (evts.length === 0) return null;
          const sub = dayLabels && dayLabels[di] && dayLabels[di].sub;
          return (
            <div key={di} style={{marginBottom:14}}>
              <div style={{fontSize:12, fontWeight:700, color:'var(--brand)', textTransform:'uppercase',
                           letterSpacing:0.6, marginBottom:6}}>
                {day.slice(0, 3)}{sub ? ' · ' + sub : ''}
              </div>
              {evts.map(ev => {
                const st = eventStyle(ev);
                const end = eventEndTime(ev);
                return (
                  <div key={ev.id} onClick={() => onEdit && onEdit(ev)}
                    style={{display:'flex', gap:10, padding:'8px 10px', marginBottom:4,
                            background: st.bg, borderLeft:'3px solid ' + st.border,
                            borderRadius:'var(--r-xs)', cursor: onEdit ? 'pointer' : 'default'}}>
                    <div style={{fontSize:12, fontWeight:700, color: st.text, minWidth:75}}>
                      {fmtTime(ev.h, ev.m || 0)}-{fmtTime(end.h, end.m)}
                    </div>
                    <div style={{flex:1, fontSize:13, fontWeight:600, color: st.text}}>{ev.title || '(sin título)'}</div>
                    <button onClick={(e) => { e.stopPropagation(); onDelete(ev.id); }}
                      style={{border:'none', background:'none', cursor:'pointer',
                              color: st.text, opacity:0.5, fontSize:14, padding:0}}>×</button>
                  </div>
                );
              })}
            </div>
          );
        })}
        {events.length === 0 && <div style={{fontSize:12, color:'var(--muted-soft)', padding:'8px 0'}}>No events this week.</div>}
      </div>
    );
  }

  // DAY view — focus day only.
  // FOCUS view — wide focus day + 6 mini columns.
  const dayCols = [0,1,2,3,4,5,6];
  const isFocus = calView === 'focus';
  const isCompact = calView === 'compact';
  // Focus keeps natural weekly order (Mon..Sun) but selected day
  // takes 1fr and the rest 22px each.
  const focusColsCSS = isFocus
    ? [0,1,2,3,4,5,6].map(d => d === focusDay ? '1fr' : '22px').join(' ')
    : null;
  const gridTemplateCols = (
    calView === 'focus' ? HOUR_W + 'px ' + focusColsCSS :
                          HOUR_W + 'px repeat(7, minmax(0, 1fr))'
  );
  const focusColOrder = dayCols;

  // Column assignment per day (interval graph coloring) — permite overlaps.
  const dayLayouts = {};
  for (let di = 0; di < 7; di++) {
    const dayEvts = events
      .filter(e => e.day === di)
      .map(e => {
        const start = e.h * 60 + (e.m || 0);
        const end = start + Math.max(30, Math.round((e.duration || 1) * 60));
        return {ev: e, start, end};
      })
      .sort((a, b) => a.start - b.start || a.end - b.end);
    const colEnds = [];
    const colMap = new Map();
    dayEvts.forEach(({ev, start, end}) => {
      let col = 0;
      while (col < colEnds.length && colEnds[col] > start) col++;
      colEnds[col] = end;
      colMap.set(ev.id, col);
    });
    dayLayouts[di] = {cols: Math.max(1, colEnds.length), colMap};
  }

  // Map real day → grid position (visual column, 1-based starting at 2 after HOUR_W).
  const dayToCol = {};
  focusColOrder.forEach((d, idx) => { dayToCol[d] = idx + 2; });
  const isDayMini = di => isFocus && di !== focusDay;

  const enableScroll = calView === 'week' || !compact;
  const minW = calView === 'week' ? (compact ? 700 : 680) : 0;
  // isCompact = mobile without scroll and without color/x buttons per event (more space for title).
  const showEvActions = !isCompact;
  return (
    <div style={{overflowX: enableScroll ? 'auto' : 'hidden'}}>
      <div style={{
        display: 'grid',
        gridTemplateColumns: gridTemplateCols,
        gridTemplateRows: HEADER_H + 'px repeat(' + SLOTS.length + ', ' + SLOT_H + 'px)',
        background:'var(--surface)', borderRadius:'var(--r-md)', overflow:'hidden',
        boxShadow:'0 2px 8px rgba(0,0,0,0.06)',
        width:'100%', minWidth: minW, position:'relative'
      }}>
        {/* Header — hour (empty, column implied) */}
        <div style={{gridRow:1, gridColumn:1, background:'var(--brand-soft)',
                     borderBottom:'2px solid var(--brand)'}}/>
        {/* Header — days */}
        {focusColOrder.map(di => {
          const day = DAYS[di];
          const mini = isDayMini(di);
          return (
            <div key={'h-'+di}
              onClick={() => {
                if (isFocus && mini) { setFocusDay && setFocusDay(di); return; }
                if (dayLabels && dayLabels[di] && dayLabels[di].onClick) dayLabels[di].onClick();
              }}
              style={{gridRow:1, gridColumn: dayToCol[di], background:'var(--brand-soft)',
                      borderBottom:'2px solid var(--brand)',
                      padding: mini ? '6px 0' : (compact ? '6px 1px' : '6px 4px'), color:'var(--brand)',
                      fontSize:11, fontWeight:700, textAlign:'center',
                      textTransform:'uppercase', letterSpacing: mini ? 0 : 0.6,
                      display:'flex', flexDirection:'column', justifyContent:'center', alignItems:'center',
                      cursor: (isFocus && mini) || (dayLabels && dayLabels[di] && dayLabels[di].onClick) ? 'pointer' : 'default',
                      overflow:'hidden'}}>
              <div style={{fontSize: mini ? 9 : undefined}}>{compact || mini ? day[0] : day.slice(0, 3)}</div>
              {!mini && dayLabels && dayLabels[di] && dayLabels[di].sub &&
                <div style={{fontSize: compact ? 9 : 10, color:'var(--brand)', fontWeight:600, marginTop:2, opacity:0.85}}>{dayLabels[di].sub}</div>}
            </div>
          );
        })}
        {/* Hour labels — solo horas en punto, cada 30min sin etiqueta para menos ruido */}
        {SLOTS.map((slot, si) => (
          <div key={'l-'+si}
            style={{gridRow: si+2, gridColumn: 1,
                    background:'transparent', textAlign:'right',
                    padding: compact ? (si === 0 ? '6px 4px 0' : '0 4px') : (si === 0 ? '8px 6px 0' : '1px 6px'),
                    fontSize: compact ? 8 : 9,
                    color:'var(--muted-soft)', fontWeight:500, whiteSpace:'nowrap',
                    lineHeight:1, display:'flex', alignItems:'flex-start', justifyContent:'flex-end'}}>
            {slot.m === 0 ? slot.lbl : ''}
          </div>
        ))}
        {/* Empty clickable cells per day × slot */}
        {SLOTS.map((slot, si) =>
          focusColOrder.map(di => (
            <div key={'c-'+si+'-'+di}
              onClick={() => {
                if (isFocus && isDayMini(di)) { setFocusDay && setFocusDay(di); return; }
                onCellClick(di, slot.h, slot.m);
              }}
              style={{gridRow: si+2, gridColumn: dayToCol[di], cursor:'pointer',
                      borderTop: si > 0 ? '1px solid var(--surface-alt)' : 'none',
                      borderLeft: '1px solid var(--surface-alt)'}}/>
          ))
        )}
        {/* Eventos superpuestos con column-assignment */}
        {events.filter(ev => dayToCol[ev.day] != null).map(ev => {
          const si = slotIdx(ev.h, ev.m || 0);
          if (si < 0 || si >= SLOTS.length) return null;
          const durSlots = Math.max(1, Math.round((ev.duration || 1) * 2));
          const layout = dayLayouts[ev.day];
          if (!layout) return null;
          const col = layout.colMap.get(ev.id) || 0;
          const cols = layout.cols;
          const st = eventStyle(ev);
          const end = eventEndTime(ev);
          const emptyTitle = !ev.title || !ev.title.trim();
          const miniEv = isDayMini(ev.day);
          return (
            <div key={ev.id}
              style={{gridRow: (si+2) + ' / span ' + durSlots,
                      gridColumn: dayToCol[ev.day],
                      display:'flex', pointerEvents:'none', zIndex: 2, padding: miniEv ? '1px 1px' : '1px 1px 0 0'}}>
              <div onClick={() => {

function GanttChart({rocks, wr, qw, upd, qKey, highlightWn, rightGutterWidth, renderRockGutter}) {
  const isMobile = useIsMobile();
  const fw = qw[0];
  const toggle = (rid, sid, wn) => {
    if (!upd || !qKey) return;
    upd(d => {
      ensureQ(d, qKey);
      const arr = d.quarters[qKey].weeklyRocks[rid] || [];
      const idx = arr.findIndex(x => x.id === sid);
      if (idx < 0) return;
      const step = arr[idx];
      if (!step.weeklyDone) step.weeklyDone = {};
      step.weeklyDone[wn] = !step.weeklyDone[wn];
      const ew = stepEndWk(step);
      const onTime = !!step.weeklyDone[ew];
      const anyLate = Object.keys(step.weeklyDone).some(w => parseInt(w) > ew && step.weeklyDone[w]);
      if (onTime) delete step.completedLate;
      else if (anyLate) step.completedLate = true;
      else delete step.completedLate;
    });
  };
  const labelW = isMobile ? 96 : 200;
  const labelPadX = isMobile ? 6 : 14;
  const stepIndent = isMobile ? 14 : 24;
  const gutterW = rightGutterWidth ? (isMobile ? 54 : rightGutterWidth) : 0;
  return (
    <div>
      <div style={{overflowX: isMobile ? 'visible' : 'auto'}}>
        <table style={{tableLayout:'fixed', borderCollapse:'collapse', width:'100%', minWidth: isMobile ? 0 : 400}}>
          <colgroup>
            <col style={{width: labelW}}/>
            {qw.map((_, i) => <col key={i}/>)}
            {rightGutterWidth > 0 && <col style={{width: gutterW}}/>}
          </colgroup>
          <thead>
            <tr className="th-brand" style={{background:'var(--brand-soft)', borderBottom:'2px solid var(--brand)'}}>
              <th style={{padding: '10px ' + labelPadX + 'px', textAlign:'left', color:'var(--text)', fontSize: isMobile ? 12 : 14, fontWeight:700}}></th>
              {qw.map(wn => {
                const isCur = highlightWn && wn === highlightWn;
                return (
                  <th key={wn}
                    style={{padding:'6px 0', textAlign:'center', fontSize: isMobile ? 10 : 11,
                            fontWeight: isCur ? 800 : 600,
                            color: isCur ? 'var(--brand)' : 'var(--text-2)',
                            background: isCur ? 'rgba(94,106,210,0.15)' : 'transparent'}}>
                    {wn - fw + 1}
                  </th>
                );
              })}
              {rightGutterWidth > 0 && <th/>}
            </tr>
          </thead>
          <tbody>
            {rocks.map(rock => {
              const steps = wr[rock.id] || [];
              const info = SI[rock.status] || SI['on-track'];
              const bg = info[0];
              const doneSteps = steps.filter(s => stepDone(s)).length;
              const totalSteps = steps.length;
              const pct = totalSteps > 0 ? Math.round((doneSteps / totalSteps) * 100) : 0;
              const rockRow = (
                <tr key={'r' + rock.id} style={{background:'var(--surface-alt)', borderTop:'2px solid var(--border-strong)'}}>
                  <td style={{padding: '9px ' + labelPadX + 'px', fontSize: isMobile ? 11 : 13, color:'var(--text)',
                              fontWeight:600,
                              overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}
                      title={rock.title}>
                    {rock.num != null && <span style={{color: rock.completed ? 'var(--ok-line)' : 'var(--brand)', fontWeight:800, marginRight:4}}>R{rock.num}</span>}
                    {rock.title}
                  </td>
                  {qw.map(wn => {
                    const isCur = highlightWn && wn === highlightWn;
                    return (
                      <td key={wn} style={{padding:'2px 1px',
                                           background: isCur ? 'rgba(94,106,210,0.08)' : 'transparent'}}/>
                    );
                  })}
                  {rightGutterWidth > 0 && (
                    <td style={{padding:'4px 8px', textAlign:'right'}}>
                      {renderRockGutter ? renderRockGutter(rock) : null}
                    </td>
                  )}
                </tr>
              );
              const curWnNow = getCurWn();
              const stepRows = steps.map(step => {
                const sw = step.startWeek || step.weekNum || fw;
                const ew = step.endWeek || step.weekNum || fw;
                const overdue = isStepOverdue(step, curWnNow);
                return (
                  <tr key={'s' + step.id} style={{borderTop:'1px solid var(--border)'}}>
                    <td style={{padding: '6px ' + labelPadX + 'px 6px ' + stepIndent + 'px', fontSize: isMobile ? 10 : 12, color:'var(--text-2)',
                                overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}
                        title={step.text}>{step.text}</td>
                    {qw.map(wn => {
                      const inR = wn >= sw && wn <= ew;
                      const chk = isWkDone(step, wn) || step.done;
                      const isCur = highlightWn && wn === highlightWn;
                      const isLateMarker = chk && wn > ew;                                // clicked late historically
                      const isOverdueSlot = overdue && wn === curWnNow && wn > ew;        // active overdue slot NOW
                      const clickable = inR || isOverdueSlot || isLateMarker;
                      // Overdue not done = transparent bar with dotted orange border.
                      // Done late = solid orange fill.
                      const barBg = isLateMarker
                        ? 'var(--warn-line)'
                        : isOverdueSlot
                          ? 'transparent'
                          : (chk ? 'var(--ok-line)' : 'var(--brand)');
                      return (
                        <td key={wn} style={{padding:'5px 1px',
                                             background: isCur ? 'rgba(94,106,210,0.08)' : 'transparent'}}>
                          {(inR || isLateMarker || isOverdueSlot) && (
                            <div onClick={() => clickable && toggle(rock.id, step.id, wn)}
                              title={isOverdueSlot ? 'Overdue — click to mark done (late)' : isLateMarker ? 'Marked done late' : undefined}
                              style={{height:11, background: barBg,
                                      borderRadius:2, margin:'0 1px',
                                      opacity: (chk || isLateMarker || isOverdueSlot) ? 1 : 0.5,
                                      cursor: clickable ? 'pointer' : 'default',
                                      border: isOverdueSlot ? '2px dashed var(--warn-line)' : 'none',
                                      boxSizing:'border-box',
                                      transition:'background .15s'}}/>
                          )}
                        </td>
                      );
                    })}
                    {rightGutterWidth > 0 && <td/>}
                  </tr>
                );
              });
              return [rockRow, ...stepRows];
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// =====================================================================
// Setup gate (Supabase URL + anon key + PIN)
// =====================================================================
function SetupGate({onReady}) {
  const cfg = getCfg();
  const [step, setStep] = useState(cfg ? 'pin' : 'config');
  const [supabaseUrl, setSupabaseUrl] = useState(cfg && cfg.url ? cfg.url : '');
  const [anonKey, setAnonKey] = useState(cfg && cfg.key ? cfg.key : '');
  const [pin, setPin] = useState('');
  const [pin2, setPin2] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);

  const saveConfig = () => {
    setErr('');
    if (!supabaseUrl.trim() || !anonKey.trim()) { setErr('Pega ambos valores.'); return; }
    if (!/^https:\/\/.+\.supabase\.co\/?$/.test(supabaseUrl.trim())) {
      setErr('URL inválida. Debe ser https://XXXX.supabase.co'); return;
    }
    setCfg({url: supabaseUrl.trim().replace(/\/$/,''), key: anonKey.trim()});
    setStep('pin');
  };

  const tryUnlock = async () => {
    setErr('');
    if (!pin || pin.length < 4) { setErr('Minimum 4 characters.'); return; }
    setBusy(true);
    try {
      const cfg2 = getCfg();
      const client = window.supabase.createClient(cfg2.url, cfg2.key);
      const {data, error} = await client.from('eos_data').select('*').eq('id', ROW_ID).maybeSingle();
      if (error) throw new Error('Error de conexión: ' + error.message);
      const key = await deriveKey(pin);
      let initialState;
      if (!data) {
        // First time ever - this PIN becomes "the" PIN
        if (pin2 !== pin) { setErr('Confirm PIN to create account.'); setBusy(false); return; }
        initialState = INIT;
        const {ciphertext, iv} = await encryptJSON(initialState, key);
        const {error: insErr} = await client.from('eos_data').insert({
          id: ROW_ID, encrypted_data: ciphertext, iv, device_id: DEVICE_ID
        });
        if (insErr) throw new Error('No se pudo crear: ' + insErr.message);
      } else {
        try {
          initialState = await decryptJSON(data.encrypted_data, data.iv, key);
        } catch (e) {
          throw new Error('PIN incorrecto.');
        }
      }
      onReady({client, key, state: normalizeData(initialState)});
    } catch (e) {
      setErr(e.message || 'Error desconocido');
      setBusy(false);
    }
  };

  const reset = () => {
    if (confirm('This deletes the saved URL and key (does NOT delete your Supabase data). Continue?')) {
      clearCfg(); setStep('config'); setSupabaseUrl(''); setAnonKey(''); setPin(''); setErr('');
    }
  };

  // Detect if first-time PIN (no row in db)
  const [needsPin2, setNeedsPin2] = useState(false);
  useEffect(() => {
    if (step !== 'pin') return;
    const cfg2 = getCfg();
    if (!cfg2) return;
    const client = window.supabase.createClient(cfg2.url, cfg2.key);
    client.from('eos_data').select('id').eq('id', ROW_ID).maybeSingle()
      .then(({data}) => setNeedsPin2(!data))
      .catch(() => {});
  }, [step]);

  return (
    <div style={{minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center',
                 background:'var(--sidebar-bg)', padding:16}}>
      <div style={{background:'var(--surface)', borderRadius:'var(--r-lg)', padding:'32px 28px', maxWidth:420, width:'100%',
                   boxShadow:'var(--elev-3)', border:'1px solid var(--border)'}}>
        <div style={{textAlign:'center', marginBottom:24}}>
          <div style={{display:'inline-flex', alignItems:'center', justifyContent:'center',
                       width:44, height:44, borderRadius:'var(--r-md)',
                       background:'var(--brand)', color:'var(--sidebar-bg)', fontWeight:700, fontSize:15,
                       letterSpacing:0.5, marginBottom:14}}>XE</div>
          <div style={{fontSize:18, fontWeight:600, color:'var(--text)', letterSpacing:-0.2}}>EOS XE</div>
          <div style={{fontSize:13, color:'var(--muted)', marginTop:4}}>
            {step === 'config' ? 'Configure your Supabase' : (needsPin2 ? 'Create your PIN' : 'Unlock your dashboard')}
          </div>
        </div>

        {step === 'config' && (
          <form onSubmit={e => { e.preventDefault(); saveConfig(); }}>
            <Fld label="Supabase URL" value={supabaseUrl} onChange={setSupabaseUrl}
              placeholder="https://XXXX.supabase.co"/>
            <Fld label="Anon Key (publishable)" value={anonKey} onChange={setAnonKey}
              placeholder="eyJhbGciOiJIUzI1Ni..."/>
            <div style={{fontSize:11, color:'var(--muted)', marginBottom:16, lineHeight:1.5}}>
              Encuéntralos en supabase.com → tu proyecto → Settings → API.
              Los valores se guardan en el navegador, no se envían a ningún lado.
            </div>
            {err && (
              <div style={{background:'var(--err-bg)', color:'var(--err-fg)', fontSize:11,
                           padding:'8px 12px', borderRadius:'var(--r-sm)', marginBottom:12,
                           borderLeft:'3px solid var(--err-line)'}}>{err}</div>
            )}
            <Btn onClick={saveConfig} style={{width:'100%'}}>Continue</Btn>
          </form>
        )}

        {step === 'pin' && (
          <form onSubmit={e => { e.preventDefault(); if (!busy) tryUnlock(); }}>
            <Fld label={needsPin2 ? 'New PIN (min 4 characters)' : 'Your PIN'}
              value={pin} onChange={setPin} type="password" placeholder="****"
              inputMode="numeric" pattern="[0-9]*" autoFocus={true}/>
            {needsPin2 && (
              <Fld label="Confirm PIN" value={pin2} onChange={setPin2} type="password" placeholder="****"
                inputMode="numeric" pattern="[0-9]*"/>
            )}
            <div style={{fontSize:11, color:'var(--muted)', marginBottom:16, lineHeight:1.5}}>
              {needsPin2
                ? 'This PIN encrypts your data. If you lose it, the data becomes unrecoverable.'
                : 'Enter the same PIN you used when setting up.'}
            </div>
            {err && (
              <div style={{background:'var(--err-bg)', color:'var(--err-fg)', fontSize:11,
                           padding:'8px 12px', borderRadius:'var(--r-sm)', marginBottom:12,
                           borderLeft:'3px solid var(--err-line)'}}>{err}</div>
            )}
            <Btn onClick={tryUnlock} disabled={busy} style={{width:'100%'}}>
              {busy ? 'Verifying...' : (needsPin2 ? 'Create and enter' : 'Unlock')}
            </Btn>
            <button type="button" onClick={reset}
              style={{width:'100%', marginTop:12, background:'none', border:'none',
                      color:'var(--muted-soft)', fontSize:11, cursor:'pointer', padding:6, fontFamily:'inherit'}}>
              Change Supabase config
            </button>
          </form>
        )}
      </div>
    </div>
  );
}

// Global search palette (Cmd+K / Ctrl+K) — busca en Vision, Rocks/Steps, Metrics,
// To-Dos, Projects, Processes, Events, Issues, Highlights, Headlines, Notes.
function SearchPalette({data, onClose, onNavigate}) {
  const [query, setQuery] = useState('');
  const [selectedIdx, setSelectedIdx] = useState(0);
  const inputRef = React.useRef();
  React.useEffect(() => { if (inputRef.current) inputRef.current.focus(); }, []);
  // Build flat index of searchable items.
  const items = React.useMemo(() => {
    const out = [];
    const v = data.vision || {};
    (v.values || []).forEach(val => out.push({type:'Value', text: val, ctx:'Vision', tab:'vision'}));
    if (v.ltView) out.push({type:'Long-Term', text: v.ltView, ctx:'Vision', tab:'vision'});
    if (v.threeYearView) out.push({type:'3-Year', text: v.threeYearView, ctx:'Vision', tab:'vision'});
    if (v.oneYearView) out.push({type:'1-Year', text: v.oneYearView, ctx:'Vision', tab:'vision'});
    Object.entries(data.quarters || {}).forEach(([qKey, qData]) => {
      const qLbl = qKey.split('-')[1];
      getQuarterRocks(data, qKey).forEach(r => {
        out.push({type:'Rock', text: 'R' + r.num + ' · ' + r.title, ctx: qLbl, tab:'rocks_all'});
        (qData.weeklyRocks?.[r.id] || []).forEach(s => {
          out.push({type:'Step', text: s.text, ctx: qLbl + ' · R' + r.num + ' ' + r.title, tab:'rocks_all'});
        });
      });
      (qData.scorecard || []).forEach(m => out.push({type:'Metric', text: m.metric, ctx: qLbl, tab:'scorecard'}));
      (qData.idsIssues || []).forEach(iss => {
        const txt = iss.sourceName + (iss.action ? ' → ' + iss.action : '');
        out.push({type:'Issue', text: txt, ctx: qLbl, tab:'l10_main'});
      });
      if (qData.qReview?.headlines) out.push({type:'Q Headlines', text: qData.qReview.headlines, ctx: qLbl, tab:'qreview_main'});
      if (qData.qReview?.notes) out.push({type:'Q Notes', text: qData.qReview.notes, ctx: qLbl, tab:'qreview_main'});
      if (qData.qReview?.vision) out.push({type:'Q Vision', text: qData.qReview.vision, ctx: qLbl, tab:'qreview_main'});
      if (qData.qReview?.nextrocks) out.push({type:'Next Rocks', text: qData.qReview.nextrocks, ctx: qLbl, tab:'qreview_main'});
      Object.entries(qData.weeks || {}).forEach(([wn, wData]) => {
        if (wData.headlines) out.push({type:'W Headlines', text: wData.headlines, ctx: qLbl + ' · W' + wn, tab:'l10_main'});
        if (wData.conclusionNotes) out.push({type:'W Notes', text: wData.conclusionNotes, ctx: qLbl + ' · W' + wn, tab:'l10_main'});
      });
    });
    (data.todos || []).forEach(t => out.push({type:'To-Do', text: t.task || '(unnamed)', ctx: t.done ? 'Done' : 'In progress', tab:'todos'}));
    (data.processes || []).forEach(p => {
      if (p.name) out.push({type:'Process', text: p.name, ctx:'Processes', tab:'procesos'});
      if (p.steps) out.push({type:'Process steps', text: p.steps, ctx: p.name || 'Process', tab:'procesos'});
    });
    Object.entries(data.weeklyProjects || {}).forEach(([wk, arr]) => {
      (arr || []).forEach(p => {
        const txt = (p.name || '(unnamed)') + (p.textStatus ? ' — ' + p.textStatus : '');
        out.push({type:'Project', text: txt, ctx: wk, tab:'projects'});
      });
    });
    Object.entries(data.weeklyCalendar || {}).forEach(([wk, arr]) => {
      (arr || []).forEach(ev => {
        out.push({type:'Event', text: ev.title || '(untitled)', ctx: wk + ' · ' + DAYS[ev.day] + ' ' + ev.h + ':' + String(ev.m || 0).padStart(2,'0'), tab:'diario'});
      });
    });
    (data.stdWeeklyEvents || []).forEach(ev => {
      out.push({type:'Std Event', text: ev.title || '(untitled)', ctx: DAYS[ev.day] + ' ' + ev.h + ':' + String(ev.m || 0).padStart(2,'0'), tab:'procesos'});
    });
    Object.entries(data.monthNotes || {}).forEach(([date, note]) => {
      if (note) out.push({type:'Highlight', text: note, ctx: date, tab:'diario', selDay: date});
    });
    return out;
  }, [data]);
  const q = query.trim().toLowerCase();
  const results = q ? items.filter(it =>
    (it.text || '').toLowerCase().includes(q) || (it.ctx || '').toLowerCase().includes(q)
  ).slice(0, 40) : [];
  React.useEffect(() => { setSelectedIdx(0); }, [query]);
  const go = it => { onNavigate(it); onClose(); };
  const onKey = e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setSelectedIdx(i => Math.min(i + 1, results.length - 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setSelectedIdx(i => Math.max(i - 1, 0)); }
    else if (e.key === 'Enter' && results[selectedIdx]) { e.preventDefault(); go(results[selectedIdx]); }
  };
  return (
    <div onClick={onClose}
      style={{position:'fixed', inset:0, background:'rgba(0,0,0,0.4)', zIndex:1000,
              display:'flex', alignItems:'flex-start', justifyContent:'center',
              paddingTop:'10vh', backdropFilter:'blur(2px)'}}>
      <div onClick={e => e.stopPropagation()}
        style={{background:'var(--surface)', width:'92%', maxWidth:560,
                borderRadius:12, boxShadow:'0 20px 60px rgba(0,0,0,0.3)',
                border:'1px solid var(--border)', overflow:'hidden',
                display:'flex', flexDirection:'column', maxHeight:'70vh'}}>
        <div style={{padding:'12px 16px', borderBottom:'1px solid var(--border)',
                     display:'flex', alignItems:'center', gap:10}}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="var(--muted)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input ref={inputRef} value={query} onChange={e => setQuery(e.target.value)}
            onKeyDown={onKey}
            placeholder="Search rocks, to-dos, metrics, events…"
            style={{flex:1, border:'none', outline:'none', fontSize:16, fontFamily:'inherit',
                    color:'var(--text)', background:'transparent', padding:0}}/>
          <span style={{fontSize:10, color:'var(--muted-soft)', border:'1px solid var(--border)',
                        padding:'2px 6px', borderRadius:'var(--r-xs)'}}>ESC</span>
        </div>
        <div style={{overflowY:'auto', flex:1}}>
          {results.length === 0 && (
            <div style={{padding:'24px 16px', textAlign:'center', color:'var(--muted-soft)', fontSize:13}}>
              {q ? 'No matches' : 'Type to search…'}
            </div>
          )}
          {results.map((it, idx) => (
            <div key={idx} onClick={() => go(it)}
              onMouseEnter={() => setSelectedIdx(idx)}
              style={{padding:'10px 16px', cursor:'pointer',
                      background: idx === selectedIdx ? 'var(--brand-soft)' : 'transparent',
                      borderLeft: idx === selectedIdx ? '3px solid var(--brand)' : '3px solid transparent',
                      display:'flex', alignItems:'center', gap:12}}>
              <span style={{fontSize:10, fontWeight:700, color:'var(--brand)',
                            background:'var(--brand-soft)', padding:'2px 6px', borderRadius:3,
                            textTransform:'uppercase', letterSpacing:0.4, minWidth:60, textAlign:'center',
                            flexShrink:0}}>{it.type}</span>
              <div style={{flex:1, minWidth:0}}>
                <div style={{fontSize:13, color:'var(--text)', fontWeight:500,
                             overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{it.text}</div>
                <div style={{fontSize:11, color:'var(--muted-soft)'}}>{it.ctx}</div>
              </div>
            </div>
          ))}
        </div>
        <div style={{padding:'8px 16px', borderTop:'1px solid var(--border)', display:'flex',
                     gap:16, fontSize:11, color:'var(--muted-soft)'}}>
          <span>↑↓ navigate</span>
          <span>↵ open</span>
          <span style={{marginLeft:'auto'}}>{results.length} result{results.length !== 1 ? 's' : ''}</span>
        </div>
      </div>
    </div>
  );
}

function App({bundle, onLogout}) {
  const {client, key, state: initial} = bundle;
  const isMobile = useIsMobile();
  const [d, setD] = useState(initial);
  const [tab, setTab] = useState('diario');
  const [selDay, setSelDay] = useState(todayStr());
  const [navOpen, setNavOpen] = useState(false);
  const [searchOpen, setSearchOpen] = useState(false);
  // Cmd+K / Ctrl+K → open global search
  useEffect(() => {
    const onKey = e => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        setSearchOpen(o => !o);
      } else if (e.key === 'Escape' && searchOpen) {
        setSearchOpen(false);
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [searchOpen]);
  // Tema: 'light' (default) | 'dark'. Persistido en localStorage.
  const [theme, setThemeState] = useState(() => {
    try { return localStorage.getItem('eos-xe-theme') === 'dark' ? 'dark' : 'light'; }
    catch(e){ return 'light'; }
  });
  const setTheme = t => {
    setThemeState(t);
    try { localStorage.setItem('eos-xe-theme', t); } catch(e){}
    if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    else document.documentElement.removeAttribute('data-theme');
  };
  useEffect(() => {
    if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    else document.documentElement.removeAttribute('data-theme');
  }, []);
  // Popover for "More" menu in sidebar footer
  const [moreOpen, setMoreOpen] = useState(false);
  const moreRef = useRef();
  useEffect(() => {
    if (!moreOpen) return;
    const h = e => { if (moreRef.current && !moreRef.current.contains(e.target)) setMoreOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, [moreOpen]);
  // Auto-open nav on desktop, keep closed on mobile
  useEffect(() => { setNavOpen(!isMobile); }, [isMobile]);
  const [syncStatus, setSyncStatus] = useState('idle');
  const importRef = useRef();
  const saveTimer = useRef(null);
  const skipNextSave = useRef(false);
  const lastSavedSerial = useRef(JSON.stringify(initial));

  // Save (debounced 800ms)
  useEffect(() => {
    if (skipNextSave.current) { skipNextSave.current = false; return; }
    const serial = JSON.stringify(d);
    if (serial === lastSavedSerial.current) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    setSyncStatus('saving');
    saveTimer.current = setTimeout(async () => {
      try {
        const {ciphertext, iv} = await encryptJSON(d, key);
        const {error} = await client.from('eos_data').upsert({
          id: ROW_ID, encrypted_data: ciphertext, iv, device_id: DEVICE_ID
        }, {onConflict:'id'});
        if (error) throw error;
        lastSavedSerial.current = serial;
        setSyncStatus('idle');
      } catch (e) {
        console.error('Save failed', e);
        setSyncStatus('error');
      }
    }, 800);
    return () => { if (saveTimer.current) clearTimeout(saveTimer.current); };
  }, [d, client, key]);

  // Realtime subscription
  useEffect(() => {
    const channel = client
      .channel('eos_data_changes')
      .on('postgres_changes',
        {event:'*', schema:'public', table:'eos_data', filter:'id=eq.' + ROW_ID},
        async payload => {
          const row = payload.new;
          if (!row || row.device_id === DEVICE_ID) return;
          try {
            const remote = await decryptJSON(row.encrypted_data, row.iv, key);
            const serial = JSON.stringify(remote);
            if (serial === lastSavedSerial.current) return;
            skipNextSave.current = true;
            lastSavedSerial.current = serial;
            setD(normalizeData(remote));
          } catch (e) {
            console.warn('Remote decrypt failed', e);
          }
        })
      .subscribe();
    return () => { client.removeChannel(channel); };
  }, [client, key]);

  // Re-fetch on visibility change (tab focus)
  useEffect(() => {
    const onVis = async () => {
      if (document.visibilityState !== 'visible') return;
      try {
        const {data: row} = await client.from('eos_data').select('*').eq('id', ROW_ID).maybeSingle();
        if (!row || row.device_id === DEVICE_ID) return;
        const remote = await decryptJSON(row.encrypted_data, row.iv, key);
        const serial = JSON.stringify(remote);
        if (serial === lastSavedSerial.current) return;
        skipNextSave.current = true;
        lastSavedSerial.current = serial;
        setD(normalizeData(remote));
      } catch (e) {}
    };
    document.addEventListener('visibilitychange', onVis);
    return () => document.removeEventListener('visibilitychange', onVis);
  }, [client, key]);

  const upd = fn => setD(prev => {
    const next = JSON.parse(JSON.stringify(prev));
    fn(next);
    return next;
  });

  const exportJSON = () => {
    const blob = new Blob([JSON.stringify(d, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'eos-xe-backup-' + todayStr() + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const importJSON = e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const p = JSON.parse(ev.target.result);
        const next = normalizeData(p);
        setD(next);
      } catch (err) { alert('Invalid JSON'); }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  const goToDay = day => { setSelDay(day); setTab('diario'); if (isMobile) setNavOpen(false); };

  const GNAV = [
    {label:null, items: [
      ['diario','Daily Summary']
    ]},
    {label:'Plan', items: [
      ['vision','Vision'],
      ['rocks_all','Rocks'],
      ['procesos','Processes']
    ]},
    {label:'Do / Capture', items: [
      ['projects','Projects'],
      ['todos','To-Dos'],
      ['scorecard','Scorecard'],
      ['month','Month']
    ]},
    {label:'Review', items: [
      ['l10_main','L10 Meetings'],
      ['qreview_main','Q Review']
    ]}
  ];
  const GNAV_FLAT = GNAV.flatMap(s => s.items);
  const syncColor = {idle:'var(--ok-line)', saving:'var(--brand)', error:'var(--err-line)', loading:'var(--info-line)'}[syncStatus] || 'var(--ok-line)';
  const syncLabel = {idle:'Synced', saving:'Saving...', error:'Sync error', loading:'Loading...'}[syncStatus] || syncStatus;

  return (
    <div className="app-shell" style={{display:'flex',
                 minHeight:'100dvh', width:'100%', maxWidth:'100vw', overflowX:'hidden',
                 background:'var(--bg)', position:'relative'}}>
      {isMobile && navOpen && (
        <div onClick={() => setNavOpen(false)}
          style={{position:'fixed', inset:0, background:'rgba(0,0,0,0.4)', zIndex:99}}/>
      )}
      <nav className="sidebar no-print" style={{width: navOpen ? (isMobile ? 240 : 200) : (isMobile ? 0 : 48),
                   background:'var(--sidebar-bg)', flexShrink:0,
                   display:'flex', flexDirection:'column',
                   position: isMobile ? 'fixed' : 'sticky', top:0, left:0,
                   height:'100dvh',
                   paddingTop: isMobile ? 'env(safe-area-inset-top, 0px)' : 0,
                   paddingBottom: isMobile ? 'env(safe-area-inset-bottom, 0px)' : 0,
                   overflowY:'auto',
                   transition:'width 0.15s', zIndex:100,
                   boxShadow:'1px 0 0 rgba(0,0,0,0.15)',
                   transform: (isMobile && !navOpen) ? 'translateX(-100%)' : 'translateX(0)'}}>
        {/* Header: logo XE + nombre + sync dot + toggle colapsar */}
        <div style={{padding: navOpen ? '12px 10px' : '12px 0', borderBottom:'1px solid rgba(255,255,255,0.07)',
                     display:'flex', alignItems:'center', gap:8,
                     justifyContent: navOpen ? 'space-between' : 'center'}}>
          {navOpen ? (
            <React.Fragment>
              <div style={{display:'flex', alignItems:'center', gap:8, minWidth:0}}>
                <div style={{width:26, height:26, borderRadius:'var(--r-sm)',
                             background:'var(--brand)', color:'var(--sidebar-bg)',
                             display:'flex', alignItems:'center', justifyContent:'center',
                             fontSize:11, fontWeight:700, letterSpacing:0.5, flexShrink:0}}>XE</div>
                <div style={{fontSize:13, fontWeight:700, color:'white', letterSpacing:0.3}}>EOS XE</div>
              </div>
              <div style={{display:'flex', alignItems:'center', gap:2, flexShrink:0}}>
                <span title={syncLabel}
                  style={{width:7, height:7, borderRadius:'50%', background:syncColor, marginRight:4}}/>
                <button onClick={() => setSearchOpen(true)} className="side-btn"
                  title={isMobile ? 'Search' : 'Search (⌘K)'}
                  style={{background:'transparent', border:'none', padding:4, width:24, height:24,
                          display:'flex', alignItems:'center', justifyContent:'center'}}>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                       stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                    <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                  </svg>
                </button>
                <button onClick={() => setNavOpen(o => !o)} className="side-btn"
                  title="Colapsar"
                  style={{background:'transparent', border:'none', padding:4, width:24, height:24,

        </div>

        {/* Nav grouped by section (expanded) or flat list (collapsed) */}
        <div style={{padding:'6px 0', flex:1, overflowY:'auto'}}>
