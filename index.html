          {tab === 'vision' && <VisionTab data={d} upd={upd}/>}
          {tab === 'month' && <MonthTab data={d} upd={upd} goToDay={goToDay}/>}
          {tab === 'rocks_all' && <RocksTab data={d} upd={upd}/>}
          {tab === 'projects' && <ProjectsTab data={d} upd={upd}/>}
          {tab === 'scorecard' && <ScorecardTab data={d} upd={upd}/>}
          {tab === 'todos' && <TodosTab data={d} upd={upd}/>}
          {tab === 'procesos' && <ProcessesTab data={d} upd={upd}/>}
          {tab === 'l10_main' && <L10MainTab data={d} upd={upd}/>}

        <SearchPalette data={d} onClose={() => setSearchOpen(false)}

  );

// -----------------------------------------------------------------
// Consolidated Vision view: everything (per-area content + per-period
// goals) in a single page with a By-area / By-period toggle.
// Areas managed inline: +Area button + Edit mode (rename/reorder/delete).
// -----------------------------------------------------------------
function VisionConsolidated({data, upd}) {
  const isMobile = useIsMobile();
  const areasList = ((data.vision && data.vision.areasList) || []);
  const areas = (data.vision && data.vision.areas) || {};
  const [editMode, setEditMode] = useState(false);
  const [view, setView] = useState(() => {
    try { return localStorage.getItem('eos-vision-view') || 'byArea'; } catch (e) { return 'byArea'; }
  });
  useEffect(() => { try { localStorage.setItem('eos-vision-view', view); } catch (e) {} }, [view]);

  // ---- Area management ----
  const addArea = () => upd(d => {
    if (!d.vision) d.vision = JSON.parse(JSON.stringify(INIT_V));
    if (!d.vision.areasList) d.vision.areasList = [];
    if (!d.vision.areas) d.vision.areas = {};
    const nk = 'a_' + uid();
    d.vision.areasList.push({k: nk, label: 'New area'});
    d.vision.areas[nk] = emptyArea();
  });
  const renameArea = (k, label) => upd(d => {
    if (!d.vision || !d.vision.areasList) return;
    const idx = d.vision.areasList.findIndex(x => x.k === k);
    if (idx >= 0) d.vision.areasList[idx].label = label;
  });
  const deleteArea = k => upd(d => {
    if (!d.vision || !d.vision.areasList) return;
    d.vision.areasList = d.vision.areasList.filter(x => x.k !== k);
    if (d.vision.areas) delete d.vision.areas[k];
  });
  const moveArea = (k, dir) => upd(d => {
    if (!d.vision || !d.vision.areasList) return;
    const arr = d.vision.areasList;
    const i = arr.findIndex(x => x.k === k);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= arr.length) return;
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  });

  // ---- Per-area content setters ----
  const setAField = (areaKey, field, val) => upd(d => {
    if (!d.vision) d.vision = JSON.parse(JSON.stringify(INIT_V));
    if (!d.vision.areas) d.vision.areas = {};
    if (!d.vision.areas[areaKey]) d.vision.areas[areaKey] = emptyArea();
    d.vision.areas[areaKey][field] = val;
  });
  // Values list helpers
  const addValue = (ak) => {
    const cur = (areas[ak] && areas[ak].values) || [];
    setAField(ak, 'values', [...cur, '']);
  };
  const updValue = (ak, i, val) => {
    const cur = (areas[ak] && areas[ak].values) || [];
    setAField(ak, 'values', cur.map((x, j) => j === i ? val : x));
  };
  const delValue = (ak, i) => {
    const cur = (areas[ak] && areas[ak].values) || [];
    setAField(ak, 'values', cur.filter((_, j) => j !== i));
  };
  const moveValue = (ak, i, dir) => {
    const cur = (areas[ak] && areas[ak].values) || [];
    const arr = [...cur];
    const j = i + dir;
    if (j < 0 || j >= arr.length) return;
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    setAField(ak, 'values', arr);
  };
  // Goals list helpers (ltGoals / threeYearGoals / oneYearGoals)
  const addGoal = (ak, field) => upd(d => {
    if (!d.vision) d.vision = JSON.parse(JSON.stringify(INIT_V));
    if (!d.vision.areas) d.vision.areas = {};
    if (!d.vision.areas[ak]) d.vision.areas[ak] = emptyArea();
    if (!d.vision.areas[ak][field]) d.vision.areas[ak][field] = [];
    d.vision.areas[ak][field].push({id: uid(), title:'', explanation:''});
  });
  const updGoal = (ak, field, id, f, val) => upd(d => {
    if (!d.vision || !d.vision.areas || !d.vision.areas[ak] || !d.vision.areas[ak][field]) return;
    const idx = d.vision.areas[ak][field].findIndex(g => g.id === id);
    if (idx >= 0) d.vision.areas[ak][field][idx][f] = val;
  });
  const delGoal = (ak, field, id) => upd(d => {
    if (!d.vision || !d.vision.areas || !d.vision.areas[ak] || !d.vision.areas[ak][field]) return;
    d.vision.areas[ak][field] = d.vision.areas[ak][field].filter(g => g.id !== id);
  });
  const moveGoal = (ak, field, id, dir) => upd(d => {
    if (!d.vision || !d.vision.areas || !d.vision.areas[ak] || !d.vision.areas[ak][field]) return;
    const arr = d.vision.areas[ak][field];
    const i = arr.findIndex(g => g.id === id);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= arr.length) return;
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  });
  const toggleGoalDone = (ak, field, id) => upd(d => {
    if (!d.vision || !d.vision.areas || !d.vision.areas[ak] || !d.vision.areas[ak][field]) return;
    const idx = d.vision.areas[ak][field].findIndex(g => g.id === id);
    if (idx >= 0) d.vision.areas[ak][field][idx].done = !d.vision.areas[ak][field][idx].done;
  });

  // ---- Renderers ----
  const renderPhrase = (ak) => {
    const a = areas[ak] || emptyArea();
    if (editMode) {
      return (
        <textarea value={a.phrase || ''}
          onChange={e => setAField(ak, 'phrase', e.target.value)}
          placeholder="Frase principal..."
          rows={1}
          ref={el => { if (el) { el.style.height='auto'; el.style.height = el.scrollHeight + 'px'; } }}
          style={{width:'100%', border:'none', outline:'none', fontSize:12, fontStyle:'italic',
                  padding:'0 0 6px', background:'transparent', resize:'none', overflow:'hidden',
                  color:'var(--muted)', fontFamily:'inherit', lineHeight:1.4}}/>
      );
    }
    return a.phrase
      ? <div style={{fontSize:12, fontStyle:'italic', color:'var(--muted)', lineHeight:1.4, padding:'0 0 6px'}}>{a.phrase}</div>
      : null;
  };
  const renderValuesList = (ak) => {
    const values = (areas[ak] && areas[ak].values) || [];
    if (values.length === 0 && !editMode) {
      return <div style={{fontSize:12, color:'var(--muted-soft)', padding:'2px 0'}}>—</div>;
    }
    return values.map((item, i) => (
      <div key={i} style={{display:'flex', alignItems:'flex-start', gap:6, marginBottom:3}}>
        <span style={{color:'var(--brand)', fontWeight:700, fontSize:13, marginTop:1, flexShrink:0}}>•</span>
        {editMode ? (
          <React.Fragment>
            <textarea value={item}
              onChange={e => updValue(ak, i, e.target.value)}
              placeholder="Value..." rows={1}
              ref={el => { if (el) { el.style.height='auto'; el.style.height = el.scrollHeight + 'px'; } }}
              style={{flex:1, border:'none', outline:'none', fontSize:13,
                      padding:'2px 0', background:'transparent', resize:'none', overflow:'hidden',
                      color:'var(--text)', fontFamily:'inherit', lineHeight:1.5,
                      borderBottom:'1px solid var(--surface-alt)'}}/>
            <div style={{display:'flex', gap:3, alignItems:'center', flexShrink:0}}>
              <MoveBtns
                disabledUp={i === 0} disabledDown={i === values.length - 1}
                onUp={() => moveValue(ak, i, -1)}
                onDown={() => moveValue(ak, i, 1)}/>
              <XBtn size={14} onClick={() => delValue(ak, i)}/>
            </div>
          </React.Fragment>
        ) : (
          <div style={{flex:1, fontSize:13, color:'var(--text)', lineHeight:1.5}}>{item}</div>
        )}
      </div>
    ));
  };
  const renderGoalsList = (ak, field) => {
    const goals = ((areas[ak] && areas[ak][field]) || []);
    if (goals.length === 0 && !editMode) {
      return <div style={{fontSize:12, color:'var(--muted-soft)', padding:'2px 0'}}>—</div>;
    }
    return goals.map((g, i) => {
      const markerColor = g.done ? 'var(--ok-line)' : 'var(--brand)';
      const marker = editMode ? (
        <button onClick={() => toggleGoalDone(ak, field, g.id)}
          title={g.done ? 'Done — click to unmark' : 'Click to mark done'}
          style={{border:'none', background:'transparent', cursor:'pointer',
                  color: markerColor, fontWeight:700, fontSize:13, padding:0,
                  marginTop:1, flexShrink:0, width:14, textAlign:'center',
                  fontFamily:'inherit'}}>{g.done ? '✓' : '•'}</button>
      ) : (
        <span style={{color: markerColor, fontWeight:700, fontSize:13, marginTop:1,
                      flexShrink:0, width:14, textAlign:'center', display:'inline-block'}}>
          {g.done ? '✓' : '•'}
        </span>
      );
      return (
        <div key={g.id} style={{display:'flex', alignItems:'flex-start', gap:6, marginBottom:3}}>
          {marker}
          {editMode ? (
            <React.Fragment>
              <textarea value={g.title || ''}
                onChange={e => updGoal(ak, field, g.id, 'title', e.target.value)}
                placeholder="Goal..." rows={1}
                ref={el => { if (el) { el.style.height='auto'; el.style.height = el.scrollHeight + 'px'; } }}
                style={{flex:1, border:'none', outline:'none', fontSize:13,
                        padding:'2px 0', background:'transparent', resize:'none', overflow:'hidden',
                        color:'var(--text)', fontFamily:'inherit', lineHeight:1.5,
                        borderBottom:'1px solid var(--surface-alt)'}}/>
              <div style={{display:'flex', gap:3, alignItems:'center', flexShrink:0}}>
                <MoveBtns
                  disabledUp={i === 0} disabledDown={i === goals.length - 1}
                  onUp={() => moveGoal(ak, field, g.id, -1)}
                  onDown={() => moveGoal(ak, field, g.id, 1)}/>
                <XBtn size={14} onClick={() => delGoal(ak, field, g.id)}/>
              </div>
            </React.Fragment>
          ) : (
            <div style={{flex:1, fontSize:13, color:'var(--text)', lineHeight:1.5}}>{g.title || '(untitled)'}</div>
          )}
        </div>
      );
    });
  };
  const renderSectionHead = (title, onAdd, opts) => {
    const noBorder = opts && opts.noBorder;
    return (
      <div key={'sh-' + title} style={{display:'flex', alignItems:'center', justifyContent:'space-between',
                   marginTop:6, marginBottom:6, paddingBottom: noBorder ? 0 : 3,
                   borderBottom: noBorder ? 'none' : '1px solid var(--surface-alt)'}}>
        <label style={{...S.lbl, marginBottom:0, fontSize:11}}>{title}</label>
        {editMode && onAdd && (
          <Btn v="sec" onClick={onAdd} style={{fontSize:10, padding:'2px 8px'}}>+ Add</Btn>
        )}
      </div>
    );
  };
  const renderAreaHead = (la, i, showPhrase) => {
    const a = areas[la.k] || emptyArea();
    return (
      <div key={'ah-' + la.k} style={{display:'flex', alignItems:'baseline', gap:8, flexWrap:'wrap',
                   marginBottom:4}}>
        {editMode ? (
          <input value={la.label} onChange={e => renameArea(la.k, e.target.value)}
            style={{flex:'0 0 auto', minWidth:80, width:'auto', border:'none', outline:'none',
                    fontSize:14, fontWeight:800, color:'var(--brand)',
                    textTransform:'uppercase', letterSpacing:0.5, lineHeight:1.2,
                    background:'transparent', fontFamily:'inherit', padding:0}}/>
        ) : (
          <div style={{flex:'0 0 auto', fontSize:14, fontWeight:800, color:'var(--brand)',
                       textTransform:'uppercase', letterSpacing:0.5, lineHeight:1.2}}>{la.label}</div>
        )}
        {showPhrase && editMode && (
          <textarea value={a.phrase || ''}
            onChange={e => setAField(la.k, 'phrase', e.target.value)}
            placeholder="Frase principal..."
            rows={1}
            ref={el => { if (el) { el.style.height='auto'; el.style.height = el.scrollHeight + 'px'; } }}
            style={{flex:1, minWidth:120, border:'none', outline:'none', fontSize:12, fontStyle:'italic',
                    padding:0, background:'transparent', resize:'none', overflow:'hidden',
                    color:'var(--muted)', fontFamily:'inherit', lineHeight:1.2}}/>
        )}
        {showPhrase && !editMode && a.phrase && (
          <div style={{flex:1, minWidth:0, fontSize:12, fontStyle:'italic', color:'var(--muted)', lineHeight:1.2}}>{a.phrase}</div>
        )}
        {editMode && (
          <div style={{marginLeft:'auto', display:'flex', gap:6, alignItems:'center'}}>
            <MoveBtns
              disabledUp={i === 0} disabledDown={i === areasList.length - 1}
              onUp={() => moveArea(la.k, -1)}
              onDown={() => moveArea(la.k, 1)}/>
            <XBtn size={14} onClick={() => {
              if (confirm('Delete area "' + la.label + '"? Its content will be lost.')) deleteArea(la.k);
            }}/>
          </div>
        )}
      </div>
    );
  };

  // ---- Layout ----
  return (
    <div>
      <div style={{display:'flex', gap:8, marginBottom:12, flexWrap:'wrap', alignItems:'center'}}>
        <Btn onClick={addArea} style={{fontSize:13}}>+ Area</Btn>
        <Btn v={editMode ? 'pri' : 'sec'} onClick={() => setEditMode(e => !e)} style={{fontSize:13}}>
          {editMode ? 'Done' : 'Edit'}
        </Btn>
        <div style={{display:'flex', gap:0, marginLeft:'auto', border:'1px solid var(--border)', borderRadius:'var(--r-sm)', overflow:'hidden'}}>
          {[['byArea','By area'], ['byPeriod','By period']].map(([k, lbl]) => (
            <button key={k} onClick={() => setView(k)}
              style={{padding:'4px 10px', border:'none', cursor:'pointer',
                      fontSize:11, fontWeight:700,
                      background: view === k ? 'var(--brand)' : 'transparent',
                      color: view === k ? 'white' : 'var(--muted)'}}>{lbl}</button>
          ))}
        </div>
      </div>
      {areasList.length === 0 && (
        <div style={{color:'var(--muted-soft)', fontSize:13}}>No areas yet. Click "+ Area" to add one.</div>
      )}
      {view === 'byArea' && areasList.map((la, i) => {
        const a = areas[la.k] || emptyArea();
        return (
        <div key={la.k} style={{...S.card, padding:0, overflow:'hidden', marginBottom:14}}>
          <div style={{padding:'12px 16px', background:'var(--surface-alt)',
                       display:'flex', alignItems:'baseline', gap:10, flexWrap:'wrap'}}>
            {editMode ? (
              <input value={la.label} onChange={e => renameArea(la.k, e.target.value)}
                style={{flex:'0 0 auto', minWidth:80, width:'auto', border:'none', outline:'none',
                        fontSize:13, fontWeight:700, color:'var(--brand)', lineHeight:1.2,
                        background:'transparent', fontFamily:'inherit', padding:0}}/>
            ) : (
              <div style={{flex:'0 0 auto', fontSize:13, fontWeight:700, color:'var(--brand)', lineHeight:1.2}}>{la.label}</div>
            )}
            {editMode ? (
              <textarea value={a.phrase || ''}
                onChange={e => setAField(la.k, 'phrase', e.target.value)}
                placeholder="Frase principal..."
                rows={1}
                ref={el => { if (el) { el.style.height='auto'; el.style.height = el.scrollHeight + 'px'; } }}
                style={{flex:1, minWidth:120, border:'none', outline:'none', fontSize:12, fontStyle:'italic',
                        padding:0, background:'transparent', resize:'none', overflow:'hidden',
                        color:'var(--muted)', fontFamily:'inherit', lineHeight:1.2}}/>
            ) : (
              a.phrase && <div style={{flex:1, minWidth:0, fontSize:12, fontStyle:'italic', color:'var(--muted)', lineHeight:1.2}}>{a.phrase}</div>
            )}
            {editMode && (
              <div style={{marginLeft:'auto', display:'flex', gap:6, alignItems:'center'}}>
                <MoveBtns
                  disabledUp={i === 0} disabledDown={i === areasList.length - 1}
                  onUp={() => moveArea(la.k, -1)}
                  onDown={() => moveArea(la.k, 1)}/>
                <XBtn size={14} onClick={() => {
                  if (confirm('Delete area "' + la.label + '"? Its content will be lost.')) deleteArea(la.k);
                }}/>
              </div>
            )}
          </div>
          <div style={{padding:'12px 18px 16px', display:'grid',
                       gridTemplateColumns: isMobile ? '1fr' : 'repeat(3, 1fr)',
                       gap: isMobile ? 0 : 20}}>
            <div>
              {renderSectionHead('Long-Term', () => addGoal(la.k, 'ltGoals'), {noBorder:true})}
              {renderGoalsList(la.k, 'ltGoals')}
            </div>
            <div>
              {renderSectionHead('3-Year', () => addGoal(la.k, 'threeYearGoals'), {noBorder:true})}
              {renderGoalsList(la.k, 'threeYearGoals')}
            </div>
            <div>
              {renderSectionHead('1-Year', () => addGoal(la.k, 'oneYearGoals'), {noBorder:true})}
              {renderGoalsList(la.k, 'oneYearGoals')}
            </div>
          </div>
        </div>
        );
      })}
      {view === 'byPeriod' && (() => {
        const PERIODS = [
          {label:'Long-Term', kind:'ltGoals'},
          {label:'3-Year', kind:'threeYearGoals'},
          {label:'1-Year', kind:'oneYearGoals'}
        ];
        return (
          <div style={{display:'grid',
                       gridTemplateColumns: isMobile ? '1fr' : 'repeat(3, 1fr)',
                       gap: isMobile ? 12 : 20}}>
            {PERIODS.map(p => (
              <div key={p.label} style={{...S.card, padding:0, overflow:'hidden'}}>
                <div style={{padding:'12px 16px', background:'var(--surface-alt)'}}>
                  <div style={{fontSize:14, fontWeight:800, color:'var(--brand)',
                               textTransform:'uppercase', letterSpacing:0.5, lineHeight:1.2}}>
                    {p.label}
                  </div>
                </div>
                <div style={{padding:'12px 18px 16px'}}>
                  {areasList.map((la, i) => (
                    <div key={la.k} style={{marginBottom: i === areasList.length - 1 ? 0 : 14}}>
                      {renderSectionHead(la.label,
                        p.kind === 'values' ? () => addValue(la.k) : () => addGoal(la.k, p.kind),
                        {noBorder:true})}
                      {p.kind === 'values' && renderPhrase(la.k)}
                      {p.kind === 'values'
                        ? renderValuesList(la.k)
                        : renderGoalsList(la.k, p.kind)}
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        );
      })()}
    </div>
  );
}

function VisionHorizon({data, upd, field, title}) {
  const areasList = ((data.vision && data.vision.areasList) || []);
  const [editMode, setEditMode] = useState(false);
  if (!areasList.length) {
    return <div style={S.card}><H3>{title}</H3><div style={{color:'var(--muted-soft)', fontSize:13}}>No areas defined yet. Go to Areas to add some.</div></div>;
  }
  const areasData = (data.vision && data.vision.areas) || {};
  const addGoal = (areaKey) => upd(d => {
    if (!d.vision) d.vision = JSON.parse(JSON.stringify(INIT_V));
    if (!d.vision.areas) d.vision.areas = {};
    if (!d.vision.areas[areaKey]) d.vision.areas[areaKey] = emptyArea();
    if (!d.vision.areas[areaKey][field]) d.vision.areas[areaKey][field] = [];
    d.vision.areas[areaKey][field].push({id: uid(), title:'', explanation:''});
  });
  const updGoal = (areaKey, id, f, val) => upd(d => {
    if (!d.vision || !d.vision.areas || !d.vision.areas[areaKey] || !d.vision.areas[areaKey][field]) return;
    const idx = d.vision.areas[areaKey][field].findIndex(g => g.id === id);
    if (idx >= 0) d.vision.areas[areaKey][field][idx][f] = val;
  });
  const delGoal = (areaKey, id) => upd(d => {
    if (!d.vision || !d.vision.areas || !d.vision.areas[areaKey] || !d.vision.areas[areaKey][field]) return;
    d.vision.areas[areaKey][field] = d.vision.areas[areaKey][field].filter(g => g.id !== id);
  });
  const moveGoal = (areaKey, id, dir) => upd(d => {
    if (!d.vision || !d.vision.areas || !d.vision.areas[areaKey] || !d.vision.areas[areaKey][field]) return;
    const arr = d.vision.areas[areaKey][field];
    const i = arr.findIndex(g => g.id === id);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= arr.length) return;
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  });
  return (
    <div>
      <div style={{display:'flex', gap:8, marginBottom:14, flexWrap:'wrap', alignItems:'center'}}>
        <Btn v={editMode ? 'pri' : 'sec'} onClick={() => setEditMode(e => !e)} style={{fontSize:13}}>
          {editMode ? 'Done' : 'Edit'}

      </div>
      {areasList.map(la => {
        const goals = ((areasData[la.k] && areasData[la.k][field]) || []);
        return (
          <div key={la.k} style={{...S.card, marginBottom:12}}>
            <div style={{display:'flex', alignItems:'center', justifyContent:'space-between',
                         paddingBottom:6, borderBottom:'1px solid var(--surface-alt)', marginBottom:10}}>
              <div style={{fontSize:14, fontWeight:800, color:'var(--brand)',
                           textTransform:'uppercase', letterSpacing:0.5}}>{la.label}</div>
              {editMode && (
                <Btn v="sec" onClick={() => addGoal(la.k)} style={{fontSize:11, padding:'3px 10px'}}>+ Goal</Btn>
              )}
            </div>
            {goals.length === 0 && (
              <div style={{fontSize:12, color:'var(--muted-soft)', padding:'4px 0'}}>—</div>
            )}
            {goals.map((g, i) => (
              <div key={g.id} style={{marginBottom:10, paddingLeft:10, borderLeft:'2px solid var(--surface-alt)'}}>
                <div style={{display:'flex', alignItems:'center', gap:8, flexWrap:'wrap'}}>
                  {editMode ? (
                    <input value={g.title || ''}
                      onChange={e => updGoal(la.k, g.id, 'title', e.target.value)}
                      placeholder="Goal title"
                      style={{flex:1, minWidth:150, border:'none', outline:'none',
                              fontSize:14, fontWeight:500, color:'var(--text)',
                              background:'transparent', fontFamily:'inherit', padding:0}}/>
                  ) : (
                    <div style={{flex:1, minWidth:150, fontSize:14, fontWeight:500, color:'var(--text)'}}>
                      {g.title || '(untitled)'}
                    </div>
                  )}
                  {editMode && (
                    <MoveBtns
                      disabledUp={i === 0} disabledDown={i === goals.length - 1}
                      onUp={() => moveGoal(la.k, g.id, -1)}
                      onDown={() => moveGoal(la.k, g.id, 1)}/>
                  )}
                  {editMode && <XBtn size={14} onClick={() => delGoal(la.k, g.id)}/>}
                </div>
                {(editMode || g.explanation) && (
                  <textarea value={g.explanation || ''}
                    onChange={e => updGoal(la.k, g.id, 'explanation', e.target.value)}
                    placeholder="Explanation..."
                    rows={1}
                    ref={el => { if (el) { el.style.height='auto'; el.style.height = el.scrollHeight + 'px'; } }}
                    style={{width:'100%', border:'none', outline:'none', fontSize:12,
                            color:'var(--muted)', background:'transparent', fontFamily:'inherit',
                            padding:'2px 0 0', resize:'none', overflow:'hidden', lineHeight:1.5}}/>
                )}
              </div>
            ))}
          </div>
        );
      })}
    </div>
  );
}

function VisionAreas({data, upd}) {
  const areasList = ((data.vision && data.vision.areasList) || []);
  const [editMode, setEditMode] = useState(false);
  const [manageMode, setManageMode] = useState(false);
  const areas = (data.vision && data.vision.areas) || {};
  const setAField = (areaKey, field, val) => upd(d => {
    if (!d.vision) d.vision = JSON.parse(JSON.stringify(INIT_V));
    if (!d.vision.areas) d.vision.areas = {};
    if (!d.vision.areas[areaKey]) d.vision.areas[areaKey] = emptyArea();
    d.vision.areas[areaKey][field] = val;
  });
  const addItem = (areaKey, field) => {
    const cur = (areas[areaKey] && areas[areaKey][field]) || [];
    setAField(areaKey, field, [...cur, '']);
  };
  const updItem = (areaKey, field, i, val) => {
    const cur = (areas[areaKey] && areas[areaKey][field]) || [];
    setAField(areaKey, field, cur.map((x, j) => j === i ? val : x));
  };
  const delItem = (areaKey, field, i) => {
    const cur = (areas[areaKey] && areas[areaKey][field]) || [];
    setAField(areaKey, field, cur.filter((_, j) => j !== i));
  };
  const moveItem = (areaKey, field, i, dir) => {
    const cur = (areas[areaKey] && areas[areaKey][field]) || [];
    const arr = [...cur];
    const j = i + dir;
    if (j < 0 || j >= arr.length) return;
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    setAField(areaKey, field, arr);
  };
  const renderList = (areaKey, field, label, placeholder) => {
    const list = (areas[areaKey] && areas[areaKey][field]) || [];
    return (
      <div key={field} style={{marginBottom:12}}>
        <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:4}}>
          <label style={{...S.lbl, marginBottom:0, fontSize:11}}>{label}</label>
          {editMode && (
            <Btn v="sec" onClick={() => addItem(areaKey, field)} style={{fontSize:10, padding:'2px 8px'}}>+ Add</Btn>
          )}
        </div>
        {list.length === 0 && !editMode && (
          <div style={{fontSize:12, color:'var(--muted-soft)', padding:'2px 0'}}>—</div>
        )}
        {list.map((item, i) => (
          <div key={i} style={{display:'flex', alignItems:'flex-start', gap:6, marginBottom:3}}>
            <span style={{color:'var(--brand)', fontWeight:700, fontSize:13, marginTop:1, flexShrink:0}}>•</span>
            {editMode ? (
              <React.Fragment>
                <textarea value={item}
                  onChange={e => updItem(areaKey, field, i, e.target.value)}
                  placeholder={placeholder} rows={1}
                  ref={el => { if (el) { el.style.height='auto'; el.style.height = el.scrollHeight + 'px'; } }}
                  style={{flex:1, border:'none', outline:'none', fontSize:13,
                          padding:'2px 0', background:'transparent', resize:'none', overflow:'hidden',
                          color:'var(--text)', fontFamily:'inherit', lineHeight:1.5,
                          borderBottom:'1px solid var(--surface-alt)'}}/>
                <div style={{display:'flex', gap:3, alignItems:'center', flexShrink:0}}>
                  <MoveBtns
                    disabledUp={i === 0} disabledDown={i === list.length - 1}
                    onUp={() => moveItem(areaKey, field, i, -1)}
                    onDown={() => moveItem(areaKey, field, i, 1)}/>
                  <XBtn size={14} onClick={() => delItem(areaKey, field, i)}/>
                </div>
              </React.Fragment>
            ) : (
              <div style={{flex:1, fontSize:13, color:'var(--text)', lineHeight:1.5}}>{item}</div>
            )}
          </div>
        ))}
      </div>
    );
  };
  // Manage-areas helpers (add/remove/rename/reorder)
  const addArea = () => upd(d => {
    if (!d.vision) d.vision = JSON.parse(JSON.stringify(INIT_V));
    if (!d.vision.areasList) d.vision.areasList = [];
    if (!d.vision.areas) d.vision.areas = {};
    const nk = 'a_' + uid();
    d.vision.areasList.push({k: nk, label: 'New area'});
    d.vision.areas[nk] = emptyArea();
  });
  const renameArea = (k, label) => upd(d => {
    if (!d.vision || !d.vision.areasList) return;
    const idx = d.vision.areasList.findIndex(x => x.k === k);
    if (idx >= 0) d.vision.areasList[idx].label = label;
  });
  const deleteArea = k => upd(d => {
    if (!d.vision || !d.vision.areasList) return;
    d.vision.areasList = d.vision.areasList.filter(x => x.k !== k);
    if (d.vision.areas) delete d.vision.areas[k];
  });
  const moveArea = (k, dir) => upd(d => {
    if (!d.vision || !d.vision.areasList) return;
    const arr = d.vision.areasList;
    const i = arr.findIndex(x => x.k === k);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= arr.length) return;
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  });
  return (
    <div>
      <div style={{display:'flex', gap:8, marginBottom:12, flexWrap:'wrap', alignItems:'center'}}>
        <Btn v={manageMode ? 'pri' : 'sec'} onClick={() => setManageMode(m => !m)} style={{fontSize:13}}>
          {manageMode ? 'Close' : 'Manage areas'}
        </Btn>
        <Btn v={editMode ? 'pri' : 'sec'} onClick={() => setEditMode(e => !e)} style={{fontSize:13}}>
          {editMode ? 'Done' : 'Edit'}
        </Btn>
      </div>
      {manageMode && (
        <div style={{...S.card, marginBottom:12}}>
          <H3 style={{marginBottom:8}}>Manage areas</H3>
          <div style={{fontSize:12, color:'var(--muted-soft)', marginBottom:10}}>
            These areas are shared with Long-Term, 3-Year, 1-Year and the {YEAR} Rocks view.
          </div>
          {areasList.map((la, i) => (
            <div key={la.k} style={{display:'flex', alignItems:'center', gap:8, marginBottom:6}}>
              <input value={la.label} onChange={e => renameArea(la.k, e.target.value)}
                style={{...S.inp, flex:1}}/>
              <MoveBtns
                disabledUp={i === 0} disabledDown={i === areasList.length - 1}
                onUp={() => moveArea(la.k, -1)}
                onDown={() => moveArea(la.k, 1)}/>
              <XBtn size={16} onClick={() => {
                if (confirm('Delete area "' + la.label + '"? Its content (phrase, roles, values, vision, long-term, etc.) will be lost.')) {
                  deleteArea(la.k);
                }
              }}/>
            </div>
          ))}
          <Btn onClick={addArea} style={{marginTop:6, fontSize:13, padding:'6px 12px'}}>+ Area</Btn>
        </div>
      )}
      {areasList.length === 0 && <div style={{color:'var(--muted-soft)', fontSize:13}}>No areas yet. Use "Manage areas" to add some.</div>}
      {areasList.map(la => {
        const a = areas[la.k] || emptyArea();
        return (
          <div key={la.k} style={{...S.card, marginBottom:12}}>
            <div style={{fontSize:14, fontWeight:800, color:'var(--brand)',
                         textTransform:'uppercase', letterSpacing:0.5,
                         paddingBottom:6, borderBottom:'1px solid var(--surface-alt)',
                         marginBottom:10}}>{la.label}</div>
            {editMode ? (
              <textarea value={a.phrase || ''}
                onChange={e => setAField(la.k, 'phrase', e.target.value)}
                placeholder="Frase principal..."
                rows={1}
                ref={el => { if (el) { el.style.height='auto'; el.style.height = el.scrollHeight + 'px'; } }}
                style={{width:'100%', border:'none', outline:'none', fontSize:14, fontWeight:700,
                        padding:'4px 0', background:'transparent', resize:'none', overflow:'hidden',
                        color:'var(--text)', fontFamily:'inherit', lineHeight:1.4,
                        borderBottom:'1px solid var(--surface-alt)', marginBottom:12}}/>
            ) : (
              a.phrase && <div style={{fontSize:14, fontWeight:700, color:'var(--text)', marginBottom:12,
                                       lineHeight:1.4}}>{a.phrase}</div>
            )}
            {renderList(la.k, 'roles',  'Roles',  'Rol...')}
            {renderList(la.k, 'values', 'Values', 'Value...')}
            {renderList(la.k, 'vision', 'Vision', 'Vision statement...')}
          </div>
        );
      })}
    </div>
  );
}

function RocksTab({data, upd}) {
  const isMobile = useIsMobile();
  const [viewMode, setViewMode] = useState('q'); // 'year' | 'q'
  const [selQ, setSelQ] = useState(getCurQ());
  const [editMode, setEditMode] = useState(false);
  const [editStep, setEditStep] = useState(null);
  const [addRock, setAddRock] = useState(false);
  const [rockForm, setRockForm] = useState({title:''});
  const [stepForms, setStepForms] = useState({});
  const [copyRock, setCopyRock] = useState({});
  const qn = parseInt(selQ.split('-Q')[1]);
  const qw = qWeeks(qn);
  const qData = data.quarters[selQ] || {rocks:[], weeklyRocks:{}};
  const rocks = getQuarterRocks(data, selQ);
  const wr = qData.weeklyRocks || {};
  // Setter for per-quarter rock status (stored in rockStatus map).
  const setRockStatus = (rockId, val) => upd(d => {
    ensureQ(d, selQ);
    if (!d.quarters[selQ].rockStatus) d.quarters[selQ].rockStatus = {};
    d.quarters[selQ].rockStatus[rockId] = val;
  });
  // Copy steps from a previous quarter (same rockId).
  const copyStepsFromQ = (rockId, fromQK) => upd(d => {
    ensureQ(d, selQ);
    const src = ((d.quarters[fromQK] && d.quarters[fromQK].weeklyRocks) || {})[rockId] || [];
    if (!src.length) return;
    const fromQw = qWeeks(parseInt(fromQK.split('-Q')[1]));
    d.quarters[selQ].weeklyRocks[rockId] = src.map(s => ({
      ...s, id: uid(), done:false, weeklyDone:{}, completedLate: false,
      startWeek: qw[0] + (s.startWeek || fromQw[0]) - fromQw[0],
      endWeek: qw[0] + (s.endWeek || fromQw[0]) - fromQw[0]
    }));
  });
  // Find prior quarters (same year) where this rock has steps.
  const prevQsWithSteps = (rockId) => {
    const currentQn = qn;
    const out = [];
    for (let p = 1; p < currentQn; p++) {
      const pk = YEAR + '-Q' + p;
      const st = ((data.quarters[pk] && data.quarters[pk].weeklyRocks) || {})[rockId];
      if (st && st.length) out.push('Q' + p);
    }
    return out;
  };

  const toggleWk = (rid, sid, wn) => upd(d => {
    ensureQ(d, selQ);
    const arr = d.quarters[selQ].weeklyRocks[rid] || [];
    const idx = arr.findIndex(x => x.id === sid);
    if (idx < 0) return;
    const step = arr[idx];
    if (!step.weeklyDone) step.weeklyDone = {};
    step.weeklyDone[wn] = !step.weeklyDone[wn];
    // Recompute completedLate: late if the step is closed only via a cell
    // > endWeek; on-time if endWeek itself is marked.
    const ew = stepEndWk(step);
    const onTime = !!step.weeklyDone[ew];
    const anyLate = Object.keys(step.weeklyDone).some(w => parseInt(w) > ew && step.weeklyDone[w]);
    if (onTime) delete step.completedLate;
    else if (anyLate) step.completedLate = true;
    else delete step.completedLate;
  });
  const updRange = (rid, sid, sw, ew) => upd(d => {
    ensureQ(d, selQ);
    const idx = (d.quarters[selQ].weeklyRocks[rid] || []).findIndex(x => x.id === sid);
    if (idx >= 0) {
      d.quarters[selQ].weeklyRocks[rid][idx].startWeek = sw;
      d.quarters[selQ].weeklyRocks[rid][idx].endWeek = ew;
    }
  });
  const doCopyRock = (rock, tq) => {
    const tqk = YEAR + '-' + tq;
    const tqw = qWeeks(parseInt(tq[1]));
    const steps = wr[rock.id] || [];
    upd(d => {
      ensureQ(d, tqk);
      const nid = uid();
      d.quarters[tqk].rocks.push({...rock, id:nid, status:'on-track'});
      if (steps.length)
        d.quarters[tqk].weeklyRocks[nid] = steps.map(s => ({
          ...s, id: uid(), done:false, weeklyDone:{},
          startWeek: tqw[0] + (s.startWeek || s.weekNum || qw[0]) - qw[0],
          endWeek: tqw[0] + (s.endWeek || s.weekNum || qw[0]) - qw[0]
        }));
    });
    setCopyRock(s => { const n = {...s}; delete n[rock.id]; return n; });
  };

  const curWn = getCurWn();
  return (
    <div>
      <PageTitle icon="rocks_all">Rocks</PageTitle>
      <div className="tabbar">
        <button onClick={() => setViewMode('year')}
          className={'tab-underline' + (viewMode === 'year' ? ' active' : '')}>
          {YEAR}
        </button>
        {QS.map(q => {
          const qk = YEAR + '-' + q;
          const isAct = viewMode === 'q' && qk === selQ;
          const isCur = qk === getCurQ();
          return (
            <button key={q}
              onClick={() => { setViewMode('q'); setSelQ(qk); setAddRock(false); }}
              className={'tab-underline' + (isAct ? ' active' : '')}
              style={!isAct && isCur ? {color:'var(--brand)'} : {}}>
              {q} {YEAR}
            </button>
          );
        })}
      </div>
      {viewMode === 'year' && <YearRocks data={data} upd={upd}/>}
      {viewMode === 'q' && <React.Fragment>
      <div style={{display:'flex', gap:8, marginBottom:14, flexWrap:'wrap', alignItems:'center'}}>
        <Btn v={editMode ? 'pri' : 'sec'} onClick={() => setEditMode(e => !e)} style={{fontSize:13}}>
          {editMode ? 'Done' : 'Edit'}
        </Btn>
        <span style={{fontSize:11, color:'var(--muted-soft)'}}>Rocks are defined in the {YEAR} view.</span>
      </div>
      <div>
        {rocks.length === 0 &&
          <EmptyState icon="target" message={'No Rocks assigned to ' + selQ.split('-')[1] + '. Go to ' + YEAR + ' view to mark rocks for this quarter.'}/>}
          {rocks.map((rock, ri) => {
            const steps = wr[rock.id] || [];
            const sf = stepForms[rock.id] || {text:'', sw: qw[0], ew: qw[0]};
            const prevQs = prevQsWithSteps(rock.id);
            return (
              <div key={rock.id} style={{...S.card, padding:0, overflow:'hidden', marginBottom:14}}>
                <div style={{padding:'12px 16px', background:'var(--surface-alt)', display:'flex',
                             alignItems:'center', gap:10, flexWrap:'wrap'}}>
                  <span style={{fontSize:11, fontWeight:800,
                                color: rock.completed ? 'white' : 'var(--brand)',
                                background: rock.completed ? 'var(--ok-line)' : 'var(--surface)',
                                padding:'2px 6px', minWidth:28, textAlign:'center',
                                borderRadius:'var(--r-xs)', flexShrink:0,
                                border:'1px solid ' + (rock.completed ? 'var(--ok-line)' : 'var(--brand-ring)')}}>R{rock.num}</span>
                  <div style={{flex:1, minWidth:130, fontWeight:600, color:'var(--text)', fontSize:13,
                               overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}
                       title={rock.title}>{rock.title || '(sin título)'}</div>
                  <StatusPill status={rock.status}
                    onChange={val => setRockStatus(rock.id, val)}/>
                  <span style={{fontSize:11, color:'var(--muted-soft)'}}>

                  {steps.map((step, si) => {
                    const sw2 = step.startWeek || step.weekNum || qw[0];

                    return (

                          ) : (
                            <div style={{flex:'0 1 200px', minWidth:120, fontSize:13, fontWeight:500, color:'var(--text)',
                                         overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}
                                 title={step.text}>{step.text}</div>
                          )}
                          <div style={{display:'flex', gap:3, flexWrap:'nowrap'}}>
                            {qw.map(wn => {
                              const inR = wn >= sw2 && wn <= ew2;
                              const chk = isWkDone(step, wn);
                              const isCur = wn === curWn;
                              const isLateMarker = chk && wn > ew2;   // marked past deadline
                              const isOverdueSlot = overdue && isCur && wn > ew2;  // active slot NOW
                              const clickable = inR || isOverdueSlot || isLateMarker;
                              const brdColor = isLateMarker || isOverdueSlot
                                ? 'var(--warn-line)'
                                : chk ? 'var(--ok-line)'
                                : (isCur ? 'var(--brand)' : !inR ? 'var(--border)' : 'var(--brand)');
                              // Overdue not done = empty (transparent) with dotted orange border.
                              // Done late = solid orange fill.
                              const bgColor = isLateMarker
                                ? 'var(--warn-line)'
                                : isOverdueSlot
                                  ? 'transparent'
                                  : (!inR ? 'var(--surface-alt)' : chk ? 'var(--ok-bg)' : 'rgba(94,106,210,0.12)');
                              const fgColor = isLateMarker
                                ? 'white'
                                : isOverdueSlot
                                  ? 'var(--warn-fg)'
                                  : (!inR ? 'var(--border-strong)' : chk ? 'var(--ok-fg)' : 'var(--brand)');
                              return (
                                <div key={wn} onClick={() => clickable && toggleWk(rock.id, step.id, wn)}
                                  title={isOverdueSlot ? 'Overdue — click to mark done (late)' : isLateMarker ? 'Marked done late' : undefined}
                                  style={{width:22, height:22, borderRadius:'var(--r-xs)',
                                          border: isOverdueSlot ? '2px solid' : (chk || isCur || isLateMarker) ? '2px solid' : '1px solid',
                                          borderStyle: isOverdueSlot ? 'dashed' : 'solid',
                                          display:'flex', alignItems:'center', justifyContent:'center',
                                          fontSize:9, fontWeight:700, cursor: clickable ? 'pointer' : 'default',
                                          borderColor: brdColor,
                                          background: bgColor,
                                          color: fgColor,
                                          boxShadow: isCur && !chk && !isOverdueSlot && !isLateMarker ? '0 0 0 2px var(--brand-ring)' : 'none'}}>
                                  {wn - qw[0] + 1}
                                </div>
                              );
                            })}
                          </div>
                          <span style={{fontSize:11, color:'var(--brand)', fontWeight:700, marginLeft:'auto'}}>
                            {sw2 - qw[0] + 1}{sw2 !== ew2 ? '-' + String(ew2 - qw[0] + 1) : ''}
                          </span>
                          {editMode && (
                            <button onClick={() => setEditStep(isEd ? null : rock.id + '-' + step.id)}
                              style={{border:'1px solid var(--border-strong)', background:'var(--surface)', cursor:'pointer',
                                      color:'var(--muted)', fontSize:11, padding:'3px 10px', borderRadius:'var(--r-sm)'}}>
                              {isEd ? 'Close' : 'Edit'}
                            </button>
                          )}
                          {editMode && (
                            <MoveBtns
                              disabledUp={si === 0} disabledDown={si === steps.length - 1}
                              onUp={() => upd(d => {
                                if (si === 0) return;
                                ensureQ(d, selQ);
                                const arr = d.quarters[selQ].weeklyRocks[rock.id];
                                const tmp = arr[si]; arr[si] = arr[si-1]; arr[si-1] = tmp;
                              })}
                              onDown={() => upd(d => {
                                ensureQ(d, selQ);
                                const arr = d.quarters[selQ].weeklyRocks[rock.id];
                                if (si === arr.length - 1) return;
                                const tmp = arr[si]; arr[si] = arr[si+1]; arr[si+1] = tmp;
                              })}/>
                          )}
                          {editMode && (
                            <XBtn size={15} onClick={() => upd(d => { ensureQ(d, selQ); d.quarters[selQ].weeklyRocks[rock.id].splice(si, 1); })}/>
                          )}
                        </div>
                        {isEd && (
                          <div style={{display:'flex', alignItems:'center', gap:8, marginTop:8,
                                       padding:'7px 10px', background:'var(--surface)', borderRadius:'var(--r-sm)',
                                       border:'1px solid var(--border)', flexWrap:'wrap'}}>
                            <span style={{fontSize:11, color:'var(--muted)'}}>From Wk</span>
                            <select value={sw2}
                              onChange={e => { const v = parseInt(e.target.value); updRange(rock.id, step.id, v, Math.max(v, ew2)); }}
                              style={{...S.inp, width:60, padding:'4px 6px', fontSize:12}}>
                              {qw.map(wn => <option key={wn} value={wn}>{wn - qw[0] + 1}</option>)}
                            </select>
                            <span style={{fontSize:11, color:'var(--muted)'}}>to Wk</span>
                            <select value={ew2}
                              onChange={e => updRange(rock.id, step.id, sw2, parseInt(e.target.value))}
                              style={{...S.inp, width:60, padding:'4px 6px', fontSize:12}}>
                              {qw.filter(wn => wn >= sw2).map(wn => <option key={wn} value={wn}>{wn - qw[0] + 1}</option>)}
                            </select>
                          </div>
                        )}
                      </div>
                    );
                  })}
                  {editMode && (
                  <div style={{display:'flex', gap:7, flexWrap:'wrap', alignItems:'center',
                               paddingTop:10, borderTop:'1px solid var(--border)'}}>
                    <input value={sf.text}
                      onChange={e => setStepForms(f => ({...f, [rock.id]: {...(f[rock.id] || {}), text: e.target.value}}))}
                      style={{...S.inp, flex:1, minWidth:130}} placeholder="Add step..."/>
                    <span style={{fontSize:11, color:'var(--muted)'}}>Wk</span>
                    <select value={sf.sw || qw[0]}
                      onChange={e => setStepForms(f => ({...f, [rock.id]: {...(f[rock.id] || {}), sw: parseInt(e.target.value), ew: Math.max(parseInt(e.target.value), sf.ew || qw[0])}}))}
                      style={{...S.inp, width:58, padding:'6px 4px', fontSize:12}}>
                      {qw.map(wn => <option key={wn} value={wn}>{wn - qw[0] + 1}</option>)}
                    </select>
                    <span style={{fontSize:11, color:'var(--muted)'}}>&gt;</span>
                    <select value={sf.ew || sf.sw || qw[0]}
                      onChange={e => setStepForms(f => ({...f, [rock.id]: {...(f[rock.id] || {}), ew: parseInt(e.target.value)}}))}
                      style={{...S.inp, width:58, padding:'6px 4px', fontSize:12}}>
                      {qw.filter(wn => wn >= (sf.sw || qw[0])).map(wn => <option key={wn} value={wn}>{wn - qw[0] + 1}</option>)}
                    </select>
                    <Btn onClick={() => {
                      if (!sf.text || !sf.text.trim()) return;
                      upd(d => {
                        ensureQ(d, selQ);
                        if (!d.quarters[selQ].weeklyRocks[rock.id]) d.quarters[selQ].weeklyRocks[rock.id] = [];
                        d.quarters[selQ].weeklyRocks[rock.id].push({
                          id: uid(), text: sf.text.trim(),
                          startWeek: sf.sw || qw[0], endWeek: sf.ew || sf.sw || qw[0],
                          weeklyDone: {}, done: false
                        });
                      });
                      setStepForms(f => ({...f, [rock.id]: {text:'', sw: qw[0], ew: qw[0]}}));
                    }}>+ Step</Btn>
                  </div>
                  )}
                </div>
              </div>
            );
          })}
      </div>
      </React.Fragment>}
    </div>
  );
}

function YearRocks({data, upd}) {
  const AREAS = ((data.vision && data.vision.areasList) || []);
  const [editMode, setEditMode] = useState(false);
  const yearKey = String(YEAR);
  const yr = (data.yearRocks && data.yearRocks[yearKey]) || {};
  const flat = getYearRocksFlat(data); // for R{n} numbering
  const numOf = id => (flat.find(x => x.rock.id === id) || {}).num || 0;
  const addRock = (areaKey) => upd(d => {
    if (!d.yearRocks) d.yearRocks = {};
    if (!d.yearRocks[yearKey]) d.yearRocks[yearKey] = {};
    if (!d.yearRocks[yearKey][areaKey]) d.yearRocks[yearKey][areaKey] = [];
    d.yearRocks[yearKey][areaKey].push({id: uid(), title:'', explanation:'', quarters:{}});
  });
  const toggleQuarter = (areaKey, id, qN) => upd(d => {
    if (!d.yearRocks || !d.yearRocks[yearKey] || !d.yearRocks[yearKey][areaKey]) return;
    const idx = d.yearRocks[yearKey][areaKey].findIndex(r => r.id === id);
    if (idx < 0) return;
    const r = d.yearRocks[yearKey][areaKey][idx];
    if (!r.quarters) r.quarters = {};
    r.quarters[qN] = !r.quarters[qN];
  });
  const toggleCompleted = (areaKey, id) => upd(d => {
    if (!d.yearRocks || !d.yearRocks[yearKey] || !d.yearRocks[yearKey][areaKey]) return;
    const idx = d.yearRocks[yearKey][areaKey].findIndex(r => r.id === id);
    if (idx < 0) return;
    d.yearRocks[yearKey][areaKey][idx].completed = !d.yearRocks[yearKey][areaKey][idx].completed;
  });
  const updField = (areaKey, id, field, val) => upd(d => {
    if (!d.yearRocks || !d.yearRocks[yearKey] || !d.yearRocks[yearKey][areaKey]) return;
    const idx = d.yearRocks[yearKey][areaKey].findIndex(r => r.id === id);
    if (idx >= 0) d.yearRocks[yearKey][areaKey][idx][field] = val;
  });
  const delRock = (areaKey, id) => upd(d => {
    if (!d.yearRocks || !d.yearRocks[yearKey] || !d.yearRocks[yearKey][areaKey]) return;
    d.yearRocks[yearKey][areaKey] = d.yearRocks[yearKey][areaKey].filter(r => r.id !== id);
  });
  const moveRock = (areaKey, id, dir) => upd(d => {
    if (!d.yearRocks || !d.yearRocks[yearKey]) return;
    const arr = d.yearRocks[yearKey][areaKey] || [];
    const i = arr.findIndex(r => r.id === id);
    if (i < 0) return;
    const j = i + dir;
    if (j >= 0 && j < arr.length) {
      // Swap within the same area
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      return;
    }
    // At boundary — move to adjacent area
    const areaIdx = AREAS.findIndex(x => x.k === areaKey);
    const nextAreaIdx = areaIdx + dir;
    if (nextAreaIdx < 0 || nextAreaIdx >= AREAS.length) return;
    const nextAreaKey = AREAS[nextAreaIdx].k;
    if (!d.yearRocks[yearKey][nextAreaKey]) d.yearRocks[yearKey][nextAreaKey] = [];
    const [rock] = arr.splice(i, 1);
    if (dir === -1) {
      // Moving up: append to end of previous area
      d.yearRocks[yearKey][nextAreaKey].push(rock);
    } else {
      // Moving down: prepend to next area
      d.yearRocks[yearKey][nextAreaKey].unshift(rock);
    }
  });
  return (
    <div>
      <div style={{display:'flex', gap:8, marginBottom:14, flexWrap:'wrap', alignItems:'center'}}>
        <Btn v={editMode ? 'pri' : 'sec'} onClick={() => setEditMode(e => !e)} style={{fontSize:13}}>
          {editMode ? 'Done' : 'Edit'}
        </Btn>
      </div>
      {AREAS.length === 0 && (
        <EmptyState icon="target" message="No areas defined. Go to Vision → Areas to add some."/>
      )}
      {AREAS.map((la, ai) => {
        const rocks = yr[la.k] || [];
        const areaData = ((data.vision && data.vision.areas) || {})[la.k] || {};
        return (
          <div key={la.k} style={{...S.card, padding:0, overflow:'hidden', marginBottom:14}}>
            <div style={{padding:'12px 16px', background:'var(--surface-alt)',
                         display:'flex', alignItems:'baseline', gap:10, flexWrap:'wrap'}}>
              <div style={{fontSize:13, fontWeight:700, color:'var(--brand)',
                           flexShrink:0, lineHeight:1.2}}>{la.label}</div>
              {areaData.phrase && (
                <div style={{flex:1, minWidth:0, fontSize:12, fontStyle:'italic',
                             color:'var(--muted)', lineHeight:1.2}}>{areaData.phrase}</div>
              )}
              {editMode && (
                <Btn v="sec" onClick={() => addRock(la.k)} style={{fontSize:11, padding:'3px 10px', marginLeft:'auto'}}>+ Rock</Btn>
              )}
            </div>
            <div style={{padding:'12px 18px 16px'}}>
            {rocks.length === 0 && (
              <div style={{color:'var(--muted-soft)', fontSize:11, marginBottom:4, fontStyle:'italic'}}>No rocks yet.</div>
            )}
            {rocks.map((r, i) => {
              const n = numOf(r.id);
              const qMap = r.quarters || {};
              const isLast = i === rocks.length - 1;
              return (
              <div key={r.id} style={{padding:'8px 0',
                                       borderBottom: isLast ? 'none' : '1px dotted var(--surface-alt)',
                                       display:'flex', alignItems:'center', gap:10, flexWrap:'wrap'}}>
                  <button
                    onClick={editMode ? () => toggleCompleted(la.k, r.id) : undefined}
                    title={r.completed ? 'Completed — click to unmark' : (editMode ? 'Click to mark completed' : '')}
                    style={{fontSize:11, fontWeight:800,
                            color: r.completed ? 'white' : 'var(--brand)',
                            background: r.completed ? 'var(--ok-line)' : 'var(--surface)',
                            padding:'2px 6px', minWidth:28, textAlign:'center',
                            borderRadius:'var(--r-xs)', flexShrink:0,
                            border: '1px solid ' + (r.completed ? 'var(--ok-line)' : 'var(--brand-ring)'),
                            cursor: editMode ? 'pointer' : 'default',
                            fontFamily:'inherit'}}>R{n}</button>
                  {editMode ? (
                    <input value={r.title || ''}
                      onChange={e => updField(la.k, r.id, 'title', e.target.value)}
                      placeholder="Rock title"
                      style={{flex:1, minWidth:130, border:'none', outline:'none',
                              fontSize:13, fontWeight:600, color:'var(--text)',
                              background:'transparent', fontFamily:'inherit', padding:0}}/>
                  ) : (
                    <div style={{flex:1, minWidth:130, fontSize:13, fontWeight:600, color:'var(--text)',
                                 overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}
                         title={r.title}>{r.title || '(untitled)'}</div>
                  )}
                  <div style={{display:'flex', gap:3, flexShrink:0}}>
                    {QS_ORDER.map(qN => {
                      const active = !!qMap[qN];
                      return (
                        <button key={qN}
                          onClick={editMode ? () => toggleQuarter(la.k, r.id, qN) : undefined}
                          style={{padding:'2px 7px', borderRadius:'var(--r-xs)',
                                  fontSize:10, fontWeight:700,
                                  border:'1px solid ' + (active ? 'var(--brand)' : 'var(--border)'),
                                  background: active ? 'var(--brand)' : 'var(--surface)',
                                  color: active ? 'white' : 'var(--muted-soft)',
                                  cursor: editMode ? 'pointer' : 'default'}}>{qN}</button>
                      );
                    })}
                  </div>
                  {editMode && (
                    <MoveBtns
                      disabledUp={n === 1}
                      disabledDown={n === flat.length}
                      onUp={() => moveRock(la.k, r.id, -1)}
                      onDown={() => moveRock(la.k, r.id, 1)}/>
                  )}
                  {editMode && <XBtn size={14} onClick={() => delRock(la.k, r.id)}/>}
              </div>
              );
            })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function ScorecardTab({data, upd}) {
  const isMobile = useIsMobile();
  const curWn = getCurWn();
  const [selQ, setSelQ] = useState(getCurQ());
  const [selWn, setSelWn] = useState(curWn);
  const [showF, setShowF] = useState(false);
  const [form, setForm] = useState({metric:'', goal:'', type:'tick', decimals:0});
  const [showCopyQ, setShowCopyQ] = useState(false);
  const [view, setView] = useState('daily'); // 'daily' | 'summary'
  const [editMode, setEditMode] = useState(false);
  const qn = parseInt(selQ.split('-Q')[1]);
  const qw = qWeeks(qn);
  const handleSetQ = qk => {
    setSelQ(qk);
    const qw2 = qWeeks(parseInt(qk.split('-Q')[1]));
    setSelWn(qw2.includes(curWn) ? curWn : qw2[0]);
  };
  const scorecard = (data.quarters[selQ] && data.quarters[selQ].scorecard) || [];
  const setDay = (mi, date, st) => upd(d => {
    ensureQ(d, selQ);
    if (!d.quarters[selQ].scorecard[mi].dayData) d.quarters[selQ].scorecard[mi].dayData = {};
    const cur = d.quarters[selQ].scorecard[mi].dayData[date];
    d.quarters[selQ].scorecard[mi].dayData[date] = cur === st ? null : st;
  });
  const move = (mi, dir) => upd(d => {
    ensureQ(d, selQ);
    const j = mi + dir;
    if (j < 0 || j >= d.quarters[selQ].scorecard.length) return;
    const tmp = d.quarters[selQ].scorecard[mi];
    d.quarters[selQ].scorecard[mi] = d.quarters[selQ].scorecard[j];
    d.quarters[selQ].scorecard[j] = tmp;
  });
  const addM = () => {
    if (!form.metric) return;
    upd(d => {
      ensureQ(d, selQ);
      const m = {id: uid(), metric: form.metric, type: form.type || 'tick', dayData:{}};
      if (m.type === 'tick') m.goal = form.goal;
      if (m.type === 'score') m.decimals = parseInt(form.decimals) || 0;
      d.quarters[selQ].scorecard.push(m);
    });
    setForm({metric:'', goal:'', type:'tick', decimals:0}); setShowF(false);
  };
  const copyToQ = tqk => {
    upd(d => {
      ensureQ(d, tqk);
      scorecard.forEach(m => {
        if (!d.quarters[tqk].scorecard.find(x => x.metric === m.metric))
          d.quarters[tqk].scorecard.push({id: uid(), metric: m.metric, goal: m.goal, dayData:{}});
      });
    });
    setShowCopyQ(false);
  };

  return (
    <div>
      <PageTitle icon="scorecard">Scorecard</PageTitle>
      <QBtns selQ={selQ} onSelect={handleSetQ}/>
      <div className="tabbar">
        <button className={'tab-underline' + (view === 'daily' ? ' active' : '')}
          onClick={() => setView('daily')}>Daily</button>
        <button className={'tab-underline' + (view === 'summary' ? ' active' : '')}
          onClick={() => setView('summary')}>13-Week Summary</button>
      </div>

      {/* Toolbar de acciones — siempre arriba y consistente entre vistas */}
      <div style={{display:'flex', gap:8, marginBottom:14, flexWrap:'wrap', alignItems:'center'}}>
        <Btn onClick={() => setShowF(true)} style={{fontSize:13}}>+ Metric</Btn>
        {view === 'daily' && (
          <Btn v={editMode ? 'pri' : 'sec'} onClick={() => setEditMode(e => !e)} style={{fontSize:13}}>
            {editMode ? 'Done' : 'Edit'}
          </Btn>
        )}
        {!showCopyQ
          ? <Btn v="sec" onClick={() => setShowCopyQ(true)} style={{fontSize:13}}>Copy to Q...</Btn>
          : <React.Fragment>
              <span style={{fontSize:11, color:'var(--muted)'}}>Copy to:</span>
              {QS.filter(q => YEAR + '-' + q !== selQ).map(q => (
                <button key={q} onClick={() => copyToQ(YEAR + '-' + q)}
                  style={{padding:'6px 12px', borderRadius:'var(--r-md)', border:'1px solid var(--brand)',
                          background:'var(--brand)', color:'white', cursor:'pointer', fontSize:13, fontWeight:700}}>{q}</button>
              ))}
              <Btn v="sec" onClick={() => setShowCopyQ(false)} style={{fontSize:13}}>Cancel</Btn>
            </React.Fragment>
        }
      </div>
      {showF && (
        <InlineForm marginTop={0}>
          <H3>New metric — {selQ.split('-')[1]}</H3>
          <Fld label="Metric" value={form.metric} onChange={v => setForm(f => ({...f, metric:v}))} placeholder="e.g. Sales calls"/>
          <div style={{marginBottom:11}}>
            <label style={S.lbl}>Type</label>
            <div style={{display:'flex', gap:6}}>
              {[['tick','Tick (ok / nok)'], ['score','Score 0–100']].map(([k, lbl]) => (
                <button key={k} onClick={() => setForm(f => ({...f, type:k}))}
                  style={{flex:'1 1 0', padding:'8px 10px', fontSize:12, fontWeight:700,
                          borderRadius:'var(--r-sm)', cursor:'pointer',
                          border:'1px solid ' + (form.type === k ? 'var(--brand)' : 'var(--border)'),
                          background: form.type === k ? 'var(--brand)' : 'white',
                          color: form.type === k ? 'white' : 'var(--text-2)'}}>{lbl}</button>

            <div style={{marginBottom:11}}>
              <label style={S.lbl}>Decimals</label>

                {[0,1,2].map(d => (
                  <button key={d} onClick={() => setForm(f => ({...f, decimals:d}))}

                            borderRadius:'var(--r-sm)', cursor:'pointer',
                            border:'1px solid ' + (form.decimals === d ? 'var(--brand)' : 'var(--border)'),
                            background: form.decimals === d ? 'var(--brand)' : 'white',
                            color: form.decimals === d ? 'white' : 'var(--text-2)'}}>{d}</button>

              </div>

          <div style={{display:'flex', gap:8}}>

      <React.Fragment>

      <div style={S.card}>

          <H3 style={{marginBottom:0}}>Week {selWn - qw[0] + 1} - {wDates(selWn)}</H3>

                  <col style={{width: isMobile ? 48 : 66}}/>

                    <th style={{padding:'8px 2px', textAlign:'center', color:'var(--text)', fontSize: isMobile ? 12 : 13, fontWeight:700}}>Goal</th>

                        {day[0]}
                      </th>
                    ))}
                    {editMode && <th/>}
                  </tr>
                </thead>
                <tbody>
                  {scorecard.map((m, mi) => {
                    const isScore = metricIsScore(m);
                    const setScore = (date, val) => upd(d => {
                      ensureQ(d, selQ);
                      if (!d.quarters[selQ].scorecard[mi].dayData) d.quarters[selQ].scorecard[mi].dayData = {};
                      d.quarters[selQ].scorecard[mi].dayData[date] = val;
                    });
                    return (
                    <tr key={m.id}>
                      <td style={{padding: isMobile ? '6px 6px' : '6px 12px'}}>
                        <input value={m.metric}
                          onChange={e => upd(d => { ensureQ(d, selQ); d.quarters[selQ].scorecard[mi].metric = e.target.value; })}
                          style={{width:'100%', border:'none', outline:'none', fontWeight:600,
                                  fontSize: isMobile ? 13 : 14, fontFamily:'inherit', color:'var(--text)',
                                  background:'transparent', padding:0}} placeholder="Metric..."/>
                      </td>
                      <td style={{padding:'6px 2px', textAlign:'center'}}>
                        {isScore ? (() => {
                          const avg = weekScoreAvg(m, selWn);
                          return (
                            <div style={{color:'var(--brand)', fontWeight:700, fontSize:13}}
                              title="Weekly average">{fmtScore(avg, m)}</div>
                          );
                        })() : (() => {
                          const cnt = weekTickCnt(m, selWn);
                          return (
                            <div style={{display:'inline-flex', alignItems:'center', justifyContent:'center', gap:3, color:'var(--brand)', fontWeight:600, fontSize:13}}>
                              <span style={{width:14, textAlign:'right', display:'inline-block'}}>{cnt}</span>
                              <span style={{color:'var(--muted)'}}>/</span>
                              <input value={m.goal || ''}
                                onChange={e => upd(d => { ensureQ(d, selQ); d.quarters[selQ].scorecard[mi].goal = e.target.value; })}
                                style={{width:14, border:'none', outline:'none', fontSize:13,
                                        fontFamily:'inherit', color:'var(--brand)', fontWeight:600,
                                        background:'transparent', padding:0, textAlign:'left'}} placeholder="—"/>
                            </div>
                          );
                        })()}
                      </td>
                      {DAYS.map((_, di) => {
                        const date = dayStr(selWn, di);
                        const st = m.dayData && m.dayData[date];
                        if (isScore) {
                          const val = typeof st === 'number' ? st : '';
                          return (
                            <td key={di} style={{padding: isMobile ? '2px 0' : 2, textAlign:'center'}}>
                              <input type="number" step={m.decimals ? (m.decimals === 1 ? '0.1' : '0.01') : '1'}
                                className="score-cell"
                                value={val}
                                onChange={e => {
                                  const v = e.target.value;
                                  if (v === '') { setScore(date, null); return; }
                                  const n = m.decimals ? parseFloat(v) : parseInt(v);
                                  if (isNaN(n)) return;
                                  setScore(date, n);
                                }}
                                style={{width:'100%', minWidth:0, height: isMobile ? 30 : 24, borderRadius:0,
                                        border:'none', background:'transparent',
                                        color:'var(--text-2)', fontWeight:500,
                                        fontSize: isMobile ? 14 : 13, textAlign:'center',
                                        fontFamily:'inherit', padding:0, boxSizing:'border-box',
                                        MozAppearance:'textfield'}}
                                placeholder="—"/>
                            </td>
                          );
                        }
                        const info = getDayStatus(st);
                        return (
                          <td key={di} style={{padding: isMobile ? '2px 0' : 2, textAlign:'center'}}>
                            <button onClick={() => setDay(mi, date, st === 'ok' ? 'nok' : st === 'nok' ? null : 'ok')}
                              style={{width:'100%', height: isMobile ? 30 : 24, borderRadius:5,
                                      border:'none', background:'transparent',
                                      color: info[1],
                                      cursor:'pointer', fontSize: isMobile ? 18 : 14, fontWeight:700,
                                      display:'inline-flex', alignItems:'center', justifyContent:'center'}}><DayTick st={st} size={isMobile ? 20 : 16}/></button>
                          </td>
                        );
                      })}
                      {editMode && (
                        <td style={{padding:'4px 4px', textAlign:'center'}}>
                          <div style={{display:'flex', gap:2, alignItems:'center', justifyContent:'center'}}>
                            <MoveBtns
                              disabledUp={mi === 0} disabledDown={mi === scorecard.length - 1}
                              onUp={() => move(mi, -1)} onDown={() => move(mi, +1)}/>
                            <XBtn size={14} onClick={() => upd(d => { ensureQ(d, selQ); d.quarters[selQ].scorecard.splice(mi, 1); })}/>
                          </div>
                        </td>
                      )}
                    </tr>
                  );
                  })}
                </tbody>
              </table>
            </div>
          )
        }
      </div>
      </React.Fragment>
      )}
    </div>
  );
}

function ScorecardSummary({scorecard, qw, selWn, onSelectWn, renderMetricExtra, bare: bareProp}) {
  const isMobile = useIsMobile();
  if (!scorecard || !scorecard.length) return null;
  // When used inside Q Review card (bare=true), skip the `S.card` wrapper so
  // W1..W13 columns align with the Rocks Gantt below.
  const bare = bareProp !== undefined ? bareProp : !!renderMetricExtra;
  const Wrapper = bare ? React.Fragment : 'div';
  const wrapProps = bare ? {} : {style: S.card};
  const labelW = isMobile ? 96 : (bare ? 200 : 130);
  const gutterW = isMobile ? 54 : 70;
  const labelPadX = isMobile ? 6 : 12;
  return (
    <Wrapper {...wrapProps}>
      {!bare && <H3>13-Week Summary</H3>}
      <div style={{overflowX: isMobile ? 'visible' : 'auto'}}>
        <table className="zebra" style={{tableLayout:'fixed', borderCollapse:'collapse', width:'100%', minWidth: isMobile ? 0 : (bare ? 500 : 0)}}>
          <colgroup>
            <col style={{width: labelW}}/>
            {qw.map((_, i) => <col key={i}/>)}
            {renderMetricExtra && <col style={{width: gutterW}}/>}
          </colgroup>
          <thead>
            <tr className="th-brand" style={{background:'var(--brand-soft)', borderBottom:'2px solid var(--brand)'}}>
              <th style={{padding: '8px ' + labelPadX + 'px', textAlign:'left', color:'var(--text)', fontSize: isMobile ? 12 : 13, fontWeight:700}}></th>
              {qw.map((wn, i) => (
                <th key={wn} onClick={() => onSelectWn && onSelectWn(wn)}
                  style={{padding:'8px 0', textAlign:'center',
                          color: wn === selWn ? 'var(--brand)' : 'var(--text-2)',
                          background: wn === selWn ? 'rgba(94,106,210,0.15)' : 'transparent',
                          fontSize: isMobile ? 10 : 11, cursor: onSelectWn ? 'pointer' : 'default',
                          fontWeight: wn === selWn ? 800 : 600}}>{i + 1}</th>
              ))}
              {renderMetricExtra && <th/>}
            </tr>
          </thead>
          <tbody>
            {scorecard.map(m => {
              const isScore = metricIsScore(m);
              return (
              <tr key={m.id}>
                <td style={{padding: '7px ' + labelPadX + 'px', fontSize: isMobile ? 11 : 13, fontWeight:600, color:'var(--text)',
                            overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}
                    title={m.metric}>
                  {m.metric}
                  {!isScore && m.goal && <span style={{color:'var(--muted)', fontWeight:500, marginLeft:isMobile ? 3 : 6, fontSize: isMobile ? 10 : 13}}>({m.goal})</span>}
                  {isScore && <span style={{color:'var(--muted)', fontWeight:500, marginLeft:isMobile ? 3 : 6, fontSize: isMobile ? 10 : 13}}>(avg)</span>}
                </td>
                {qw.map(wn => {
                  const isSel = wn === selWn;
                  let content, col;
                  if (isScore) {
                    const avg = weekScoreAvg(m, wn);
                    col = avg == null ? 'var(--muted-soft)' : 'var(--brand)';
                    content = avg == null ? '·' : fmtScore(avg, m);
                  } else {
                    const cnt = weekTickCnt(m, wn);
                    const goal = parseInt(m.goal || 0);
                    const hasGoal = !isNaN(goal) && goal > 0;
                    const done = hasGoal && cnt >= goal;
                    col = done ? 'var(--brand)' : 'var(--muted-soft)';
                    content = cnt > 0 ? cnt : (weekAllX(m, wn) ? 0 : '·');
                  }
                  return (
                    <td key={wn} onClick={() => onSelectWn && onSelectWn(wn)}
                      style={{padding:'2px 0', textAlign:'center', cursor: onSelectWn ? 'pointer' : 'default',
                              background: isSel ? 'rgba(94,106,210,0.08)' : undefined}}>
                      <div style={{height: isMobile ? 22 : 26, borderRadius:'var(--r-xs)',
                                   display:'flex', alignItems:'center', justifyContent:'center',
                                   fontSize: isMobile ? 11 : 13, color:col, fontWeight:700}}>
                        {content}
                      </div>
                    </td>
                  );
                })}
                {renderMetricExtra && (
                  <td style={{padding: isMobile ? '4px 4px' : '4px 8px', textAlign:'right'}}>{renderMetricExtra(m)}</td>
                )}
              </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </Wrapper>
  );
}

function ProjectsTab({data, upd}) {
  const isMobile = useIsMobile();
  const [editMode, setEditMode] = useState(false);
  const curWn = getCurWn();
  const [selQ, setSelQ] = useState(getCurQ());
  const [selWn, setSelWn] = useState(curWn);
  const wk = wKey(selWn);
  const projects = (data.weeklyProjects && data.weeklyProjects[wk]) || [];
  const addProject = () => upd(d => {
    if (!d.weeklyProjects) d.weeklyProjects = {};
    if (!d.weeklyProjects[wk]) d.weeklyProjects[wk] = [];
    d.weeklyProjects[wk].push({id: uid(), name:'', textStatus:''});
  });
  const copyToNext = () => {
    const nwk = wKey(selWn + 1);
    upd(d => {
      if (!d.weeklyProjects) d.weeklyProjects = {};
      if (!d.weeklyProjects[nwk]) d.weeklyProjects[nwk] = [];
      projects.forEach(p => { d.weeklyProjects[nwk].push({...p, id: uid()}); });
    });
  };
  const createTodoFromProject = (proj) => upd(d => {
    const taskName = (proj.name || '(unnamed)') + (proj.textStatus ? ' — ' + proj.textStatus : '');
    d.todos.push({id: uid(), task: taskName, startDate: todayStr(), due: '', done: false, completedDate: null});
  });
  return (
    <div>
      <PageTitle icon="projects">Projects</PageTitle>
      <QBtns selQ={selQ} onSelect={q => {
        setSelQ(q);
        const qw2 = qWeeks(parseInt(q.split('-Q')[1]));
        setSelWn(qw2.includes(curWn) ? curWn : qw2[0]);
      }}/>
      <WkBtns selQ={selQ} selWn={selWn} onSelect={setSelWn}/>
      <div style={{display:'flex', gap:8, marginBottom:14, flexWrap:'wrap'}}>
        <Btn onClick={addProject} style={{fontSize:13}}>+ Project</Btn>
        <Btn v={editMode ? 'pri' : 'sec'} onClick={() => setEditMode(e => !e)} style={{fontSize:13}}>
          {editMode ? 'Done' : 'Edit'}
        </Btn>
        <Btn v="sec" onClick={copyToNext} style={{fontSize:13}}>Copy to Next Week</Btn>
      </div>
      {projects.length === 0 &&
        <div style={{...S.card, textAlign:'center', color:'var(--muted-soft)', padding:28, fontSize:13}}>
          No projects for week {selWn}.
        </div>}
      {projects.length > 0 && (
        <div style={S.card}>
          <H3>Week {selWn} · {wDates(selWn)}</H3>
          <table style={{width:'100%', borderCollapse:'collapse'}}>
            <thead>
              <tr style={{borderBottom:'2px solid var(--border)'}}>
                <th style={{fontSize:10, fontWeight:700, color:'var(--muted-soft)', textTransform:'uppercase',
                            letterSpacing:0.5, padding:'0 0 8px', textAlign:'left', width: isMobile ? '55%' : '45%'}}>Project</th>
                <th style={{fontSize:10, fontWeight:700, color:'var(--muted-soft)', textTransform:'uppercase',
                            letterSpacing:0.5, padding:'0 0 8px', textAlign:'left'}}>Status</th>
                {editMode && <th style={{width: isMobile ? 48 : 60}}/>}
                {editMode && <th style={{width:60}}/>}
              </tr>
            </thead>
            <tbody>
              {projects.map((proj, pi) => (
                <tr key={proj.id}>
                  <td style={{padding:'7px 12px 7px 0', verticalAlign:'middle'}}>
                    <input value={proj.name || ''}
                      onChange={e => upd(d => { d.weeklyProjects[wk][pi].name = e.target.value; })}
                      placeholder="Project name..."
                      style={{width:'100%', border:'none', outline:'none', fontSize:13,
                              fontWeight:700, fontFamily:'inherit', color:'var(--text)',
                              background:'transparent', padding:0}}/>
                  </td>
                  <td style={{padding:'7px 0', verticalAlign:'middle'}}>
                    <input value={proj.textStatus || ''}
                      onChange={e => upd(d => { d.weeklyProjects[wk][pi].textStatus = e.target.value; })}
                      placeholder="Status..."
                      style={{width:'100%', border:'none', outline:'none', fontSize:12,
                              fontFamily:'inherit', color:'var(--muted)',
                              background:'transparent', padding:0}}/>
                  </td>
                  {editMode && (
                    <td style={{textAlign:'center', verticalAlign:'middle', padding:'4px 6px'}}>
                      <button onClick={() => createTodoFromProject(proj)}
                        style={{padding:'2px 8px', borderRadius:'var(--r-md)', border:'1px solid var(--border-strong)', cursor:'pointer',
                                fontSize:10, fontWeight:700, background:'var(--surface)', color:'var(--text-2)',
                                whiteSpace:'nowrap'}}>+ To-do</button>
                    </td>
                  )}
                  {editMode && (
                    <td style={{textAlign:'right', verticalAlign:'middle', padding:'4px 0'}}>
                      <div style={{display:'flex', gap:3, alignItems:'center', justifyContent:'flex-end'}}>
                        <MoveBtns
                          disabledUp={pi === 0} disabledDown={pi === projects.length - 1}
                          onUp={() => upd(d => {
                            if (pi === 0) return;
                            const arr = d.weeklyProjects[wk];
                            const tmp = arr[pi]; arr[pi] = arr[pi-1]; arr[pi-1] = tmp;
                          })}
                          onDown={() => upd(d => {
                            if (pi === d.weeklyProjects[wk].length - 1) return;
                            const arr = d.weeklyProjects[wk];
                            const tmp = arr[pi]; arr[pi] = arr[pi+1]; arr[pi+1] = tmp;
                          })}/>
                        <XBtn size={14} onClick={() => upd(d => { d.weeklyProjects[wk].splice(pi, 1); })}/>
                      </div>
                    </td>
                  )}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function TodosTab({data, upd}) {
  const isMobile = useIsMobile();
  const [showF, setShowF] = useState(false);
  const [showDone, setShowDone] = useState(false);
  const [editMode, setEditMode] = useState(false);
  const [form, setForm] = useState({task:'', startDate: todayStr()});
  const [editingId, setEditingId] = useState(null);
  const today = todayStr();
  const curWn = getCurWn();
  const add = () => {
    if (!form.task) return;
    upd(d => { d.todos.push({id: uid(), ...form, done:false, completedDate:null}); });
    setForm({task:'', startDate: todayStr()}); setShowF(false);
  };
  // Keep data.todos order — user controls sorting manually via ↑/↓.
  const pending = data.todos.filter(t => !t.done);
  // Completed: only those completed during the CURRENT week
